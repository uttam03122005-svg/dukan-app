<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:18px;margin-right:4px;}
.btn-call{background:#2e7d32;color:#fff;}
.btn-wa{background:#25d366;color:#fff;}
.btn-sms{background:#1976d2;color:#fff;}

.pick-btn{
  width:100%;
  padding:16px;
  border:2px dashed #1976d2;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  color:#1976d2;
  background:#e3f2fd;
  cursor:pointer;
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-sizing:border-box;
}
.pick-btn:active{opacity:0.7;}

.img-status{
  font-size:13px;color:#666;margin-top:8px;text-align:center;
  min-height:18px;padding:6px;border-radius:6px;
}
.img-status.success{background:#e8f5e9;color:#2e7d32;font-weight:bold;}
.img-status.error{background:#ffebee;color:#c62828;}
.img-status.loading{background:#fff3e0;color:#e65100;}

#pPreview{
  max-width:100%;margin-top:10px;border-radius:10px;display:none;
  box-shadow:0 2px 10px rgba(0,0,0,.2);max-height:320px;
  object-fit:contain;background:#f5f5f5;width:100%;
}

#cameraModal{
  display:none;position:fixed;inset:0;background:#000;z-index:1000;
  flex-direction:column;
}
#cameraVideo{flex:1;width:100%;object-fit:cover;background:#000;}
.camera-controls{
  padding:20px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  background:#000;display:flex;gap:12px;
  justify-content:center;align-items:center;
}
.cam-btn{
  padding:16px 24px;border:none;border-radius:50px;
  font-size:16px;font-weight:bold;color:#fff;cursor:pointer;
}
.cam-cancel{background:#666;}
.cam-capture{background:#2e7d32;padding:16px 40px;font-size:18px;}
.cam-switch{background:#1976d2;padding:16px 20px;}

#cameraCanvas{display:none;}

.ledger-entry{
  padding:10px;border-bottom:1px solid #eee;background:#fff;
  margin-bottom:4px;border-radius:6px;
}
.ledger-entry.udhar{border-left:4px solid #e65100;}
.ledger-entry.jama{border-left:4px solid #2e7d32;}

.modal-udhar-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:500;padding:16px;
}
.modal-udhar{
  background:#fff;border-radius:12px;padding:16px;
  width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
}

.type-btn{
  flex:1;padding:10px;border:2px solid #ddd;border-radius:8px;
  background:#fff;font-weight:bold;color:#333;cursor:pointer;
  font-size:13px;
}
.type-btn.selected-udhar{border-color:#e65100;background:#fff3e0;color:#e65100;}
.type-btn.selected-jama{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32;}

.udhar-item-row{
  display:flex;gap:6px;align-items:center;
  padding:8px;background:#fff;border-radius:6px;
  margin-bottom:6px;border:1px solid #eee;
}
</style>
</head>
<body>
<div class="header">
<h1>👨‍💼 Owner</h1>
<button onclick="logout()">Logout</button>
</div>

<div class="container">
<div class="card" style="display:flex;padding:0;overflow:auto;">
<button class="primary tabBtn" data-tab="products" style="border-radius:0;font-size:12px;">Products</button>
<button class="primary tabBtn" data-tab="users" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Customers</button>
<button class="primary tabBtn" data-tab="orders" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Orders</button>
<button class="primary tabBtn" data-tab="udhar" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Udhar</button>
<button class="primary tabBtn" data-tab="info" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">ℹ️</button>
</div>

<!-- PRODUCTS TAB -->
<div id="tab-products">
<div class="card">
<h3 id="pFormTitle">➕ Naya Product</h3>
<input type="hidden" id="pId">
<input id="pName" placeholder="Product name">

<div style="display:flex;gap:8px;margin-top:8px;">
  <button type="button" class="pick-btn" style="flex:1;background:#e8f5e9;border-color:#2e7d32;color:#2e7d32;margin-top:0;" onclick="openLiveCamera()">
    📷 Camera
  </button>
  <label for="pImgGallery" class="pick-btn" style="flex:1;margin-top:0;">
    🖼️ Gallery
  </label>
</div>

<input id="pImgGallery" type="file" accept="image/*" onchange="handleImageSelect(event)" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;">

  <video id="cameraVideo" autoplay playsinline muted></video>

    <button type="button" class="cam-btn cam-cancel" onclick="closeCamera()">✕ Cancel</button>

    <button type="button" class="cam-btn cam-switch" onclick="switchCamera()">🔄</button>

<canvas id="cameraCanvas"></canvas>

<button class="primary" style="background:#1976d2;" onclick="addUnit()">➕ Unit</button>
<button class="primary" onclick="saveProduct()">💾 Save</button>
<button class="primary" style="background:#777;" onclick="resetProductForm()">Reset</button>
</div>

<div id="userList"></div>
</div>

<!-- ORDERS TAB -->

<div id="orderList"></div>
</div>

<!-- UDHAR TAB -->
<div id="tab-udhar" class="hidden">
  <div class="card" style="background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;">
    <h3 style="color:#fff;margin-bottom:10px;">💰 Udhar Khata</h3>

      <div>
        <div style="font-size:22px;font-weight:bold;" id="udTotalAdvance">₹0</div>
        <div style="font-size:11px;opacity:0.9;">💚 Total Advance</div>
      </div>

        <div style="font-size:22px;font-weight:bold;" id="udTotalCustomers">0</div>
        <div style="font-size:11px;opacity:0.9;">👥 Customers</div>
      </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">

<div id="tab-info" class="hidden">

<script src="app.js"></script>
<script>
const s = getSession();
if (!s || s.role !== 'owner') location.replace('index.html');

let DATA = null, editingImageUrl = '', currentUnits = [];
let compressedImageFile = null;

// Udhar builder state
let udharBuilder = { user_id: '', type: 'udhar', items: [], note: '', date: '' };

async function init() {
  const ok = await waitForFirebase();
  if (!ok) { alert('Firebase ready nahi'); return; }
  const uid = await waitForAuth();
  if (!uid) { alert('Session expire'); location.replace('index.html'); return; }
  DATA = await loadData();
  renderProducts(); renderUsers(); renderOrders(); renderUdhar(); renderInfo();
  resetProductForm();

  const modeInfo = document.getElementById('modeInfo');
  const modes = [];
  if (isPWA()) modes.push('📱 PWA');
  if (isWebView()) modes.push('🔍 WebView');
  if (!isPWA() && !isWebView()) modes.push('🌐 Browser');
  if (location.protocol === 'https:') modes.push('🔒 HTTPS');
  modeInfo.textContent = modes.join(' • ') || 'Unknown';

  const notifPerm = document.getElementById('notifPermission');
  if (typeof Notification !== 'undefined') notifPerm.textContent = Notification.permission;
  else notifPerm.textContent = 'Not supported';
}

function switchTab(t) {
  document.querySelectorAll('.tabBtn').forEach(b => {
    if (b.dataset.tab === t) { b.style.background = '#2e7d32'; b.style.color = '#fff'; }
    else { b.style.background = '#ccc'; b.style.color = '#333'; }
  });
  ['products','users','orders','udhar','info'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('hidden', x !== t);
  });
}
document.querySelectorAll('.tabBtn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

function renderInfo() {
  document.getElementById('secretInfo').innerHTML = `
    <div style="padding:4px 0;">ImgBB: ${SECRET.imgbb_key ? '✅' : '❌'}</div>
    <div style="padding:4px 0;">UPI: ${SECRET.upi_id || '❌'}</div>
    <div style="padding:4px 0;">Firebase: ${FB_READY ? '✅ ready' : '❌ not ready'}</div>
    <div style="padding:4px 0;">Owner UID: ${(getAuthUid() || '').substring(0,10)}...</div>
  `;
}

async function enableNotifications() {
  const status = document.getElementById('notifStatus');
  status.style.color = '#666';
  status.textContent = '⏳ Setting up...';
  try {
    const token = await setupOwnerNotifications();
    if (token) {
      status.style.color = '#2e7d32';
      status.textContent = '✅ Notifications ON';
      document.getElementById('notifPermission').textContent = Notification.permission;
      toast('✅ Notifications enable!');
    } else {
      status.style.color = '#c62828';
      status.textContent = '❌ Token nahi mila';
    }
  } catch (e) {
    status.style.color = '#c62828';
    status.textContent = '❌ ' + (e.message || 'Error');
  }
}

/* ================= LIVE CAMERA ================= */
let cameraStream = null;
let currentFacingMode = 'environment';

async function openLiveCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('❌ Camera support nahi. Gallery use karo.');
    document.getElementById('pImgGallery').click();
    return;
  }
  try {
    if (cameraStream) {
      cameraStream.getTracks().forEach(t => t.stop());
      cameraStream = null;
    }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const modal = document.getElementById('cameraModal');
    const video = document.getElementById('cameraVideo');
    modal.style.display = 'flex';
    video.srcObject = cameraStream;
    await video.play();
  } catch (err) {
    let msg = 'Camera nahi khul paya';
    if (err.name === 'NotAllowedError') msg = '❌ Camera permission denied';
    else if (err.name === 'NotFoundError') msg = '❌ Camera nahi mila';
    else if (err.name === 'NotReadableError') msg = '❌ Camera busy hai';
    toast(msg);
    setTimeout(() => {
      if (confirm('Camera nahi khul paya. Gallery se photo chunna chahte ho?')) {
        document.getElementById('pImgGallery').click();
      }
    }, 300);
  }
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const modal = document.getElementById('cameraModal');
  const video = document.getElementById('cameraVideo');
  if (modal) modal.style.display = 'none';
  if (video) video.srcObject = null;
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  if (!video.videoWidth || !video.videoHeight) {
    toast('❌ Camera ready nahi hai');
    return;
  }
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob((blob) => {
    if (!blob) { toast('❌ Photo capture fail'); return; }
    const file = new File([blob], 'camera-' + Date.now() + '.jpg', { type: 'image/jpeg' });
    closeCamera();
    processCapturedPhoto(file);
  }, 'image/jpeg', 0.9);
}

async function switchCamera() {
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode }, audio: false
    });
    const video = document.getElementById('cameraVideo');
    video.srcObject = cameraStream;
    await video.play();
  } catch (err) {
    toast('❌ Camera switch fail');
    closeCamera();
  }
}

function processCapturedPhoto(file) {
  const status = document.getElementById('imgStatus');
  const prev = document.getElementById('pPreview');
  status.className = 'img-status';
  status.textContent = '⏳ Processing...';
  if (file.size > 10 * 1024 * 1024) {
    toast('❌ Photo 10MB se badi');
    status.textContent = '❌ File bahut badi';
    status.className = 'img-status error';
    return;
  }
  try {
    const quickUrl = URL.createObjectURL(file);
    prev.src = quickUrl;
    prev.style.display = 'block';
    status.textContent = `📷 ${(file.size/1024).toFixed(0)} KB — compressing...`;
  } catch(e) {}
  compressImage(file, 1000, 1000, 0.75).then(compressed => {
    compressedImageFile = compressed;
    const newUrl = URL.createObjectURL(compressed);
    prev.src = newUrl;
    prev.style.display = 'block';
    status.textContent = `✅ Ready (${(compressed.size/1024).toFixed(0)} KB)`;
    status.className = 'img-status success';
  }).catch(err => {
    compressedImageFile = file;
    status.textContent = `📷 ${(file.size/1024).toFixed(0)} KB (original)`;
  });
}

function handleImageSelect(event) {
  const input = event.target;
  const file = input.files && input.files[0];
  const status = document.getElementById('imgStatus');
  const prev = document.getElementById('pPreview');
  if (!file) return;
  status.className = 'img-status';
  if (file.size > 10 * 1024 * 1024) {
    toast('❌ Image 10MB se choti honi chahiye');
    status.textContent = '❌ File bahut badi';
    status.className = 'img-status error';
    return;
  }
  if (!file.type || !file.type.startsWith('image/')) {
    toast('❌ Sirf image file chuno');
    status.textContent = '❌ Ye image nahi hai';
    status.className = 'img-status error';
    return;
  }
  status.textContent = '⏳ Loading...';
  status.className = 'img-status loading';
  try {
    const quickUrl = URL.createObjectURL(file);
    prev.src = quickUrl;
    prev.style.display = 'block';
    status.textContent = `📷 ${(file.size/1024).toFixed(0)} KB — compressing...`;
  } catch(e) {}
  compressImage(file, 1000, 1000, 0.75).then(compressed => {
    compressedImageFile = compressed;
    const newUrl = URL.createObjectURL(compressed);
    prev.src = newUrl;
    prev.style.display = 'block';
    status.textContent = `✅ Ready (${(compressed.size/1024).toFixed(0)} KB)`;
    status.className = 'img-status success';
  }).catch(err => {
    compressedImageFile = file;
    status.textContent = `📷 ${(file.size/1024).toFixed(0)} KB (original)`;
  });
  setTimeout(() => { try { input.value = ''; } catch(e){} }, 500);
}

function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve) => {
    const fallback = () => resolve(file);
    try {
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const img = new Image();
          img.onload = () => {
            try {
              let w = img.width, h = img.height;
              if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
              if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              canvas.toBlob((blob) => {
                if (!blob) return fallback();
                const outName = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
                resolve(new File([blob], outName, { type: 'image/jpeg' }));
              }, 'image/jpeg', quality);
            } catch(err) { fallback(); }
          };
          img.onerror = () => fallback();
          img.src = e.target.result;
        } catch(err) { fallback(); }
      };
      reader.onerror = () => fallback();
      reader.readAsDataURL(file);
    } catch(err) { fallback(); }
  });
}

/* ================= PRODUCTS — SIMPLE NAPNE WALA ================= */
function addUnit(data) {
  currentUnits.push(data || { label:'piece', retail:'', wholesale:'', stock:'', size:'' });
  renderUnits();
}

function removeUnit(i) { 
  currentUnits.splice(i,1); 
  renderUnits(); 
}

function updateUnit(i,k,v) { 
  currentUnits[i][k] = v;
  if (k === 'label') currentUnits[i].size = '';
}

function renderUnits() {
  const box = document.getElementById('unitList');
  const OPT = ['kg','gram','liter','ml','piece','packet','box','dozen','strip','bottle'];
  const MEASURED_UNITS = ['kg','gram','liter','ml'];
  const COUNT_UNITS = ['packet','box','dozen','strip','bottle'];

  box.innerHTML = currentUnits.map((u,i) => {
    const isMeasured = MEASURED_UNITS.includes(u.label);
    const isCount = COUNT_UNITS.includes(u.label);
    const canHaveSize = isMeasured || isCount;

    return `
    <div style="background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:10px;border:1px solid #eee;">
      <div class="row">
        <select onchange="updateUnit(${i},'label',this.value); renderUnits();">
          ${OPT.map(o => `<option value="${o}" ${u.label===o?'selected':''}>${o}</option>`).join('')}
        </select>
        <button class="primary small danger" style="flex:0;width:auto;" onclick="removeUnit(${i})">✕</button>
      </div>

      ${canHaveSize ? `
        <div style="margin-top:8px;">
          <label style="font-size:13px;color:#333;font-weight:bold;display:block;margin-bottom:6px;">
            📏 Ye product kaise bechte ho?
          </label>
          <div style="display:flex;gap:8px;">
            <button type="button" 
                    onclick="updateUnit(${i},'size',''); renderUnits();"
                    style="flex:1;padding:12px 8px;border:2px solid ${!u.size?'#2e7d32':'#ddd'};border-radius:8px;background:${!u.size?'#e8f5e9':'#fff'};font-weight:bold;color:${!u.size?'#2e7d32':'#333'};cursor:pointer;font-size:13px;">
              ⚖️ Khula (Loose)
            </button>
            <button type="button" 
                    onclick="updateUnit(${i},'size','FIXED'); renderUnits();"
                    style="flex:1;padding:12px 8px;border:2px solid ${u.size?'#2e7d32':'#ddd'};border-radius:8px;background:${u.size?'#e8f5e9':'#fff'};font-weight:bold;color:${u.size?'#2e7d32':'#333'};cursor:pointer;font-size:13px;">
              📦 Packet (Fixed)
            </button>
          </div>
          <div style="font-size:11px;color:#888;margin-top:6px;">
            ${!u.size 
              ? '✅ Customer 250gm, 500gm, 1kg... choose karega' 
              : '✅ Customer sirf 1, 2, 3 packet choose karega'}
          </div>
        </div>
      ` : ''}

      <div class="row" style="margin-top:8px;">
        <input placeholder="Retail ₹" inputmode="decimal" value="${u.retail}" onchange="updateUnit(${i},'retail',this.value)">
        <input placeholder="Whole ₹" inputmode="decimal" value="${u.wholesale}" onchange="updateUnit(${i},'wholesale',this.value)">
      </div>
      <input placeholder="Stock" inputmode="decimal" value="${u.stock}" onchange="updateUnit(${i},'stock',this.value)">
    </div>`;
  }).join('');
}

function resetProductForm() {
  ['pId','pName','pCat'].forEach(id => document.getElementById(id).value = '');
  try { document.getElementById('pImgGallery').value = ''; } catch(e){}
  closeCamera();
  const prev = document.getElementById('pPreview');
  prev.style.display = 'none';
  prev.src = '';
  const status = document.getElementById('imgStatus');
  status.textContent = '';
  status.className = 'img-status';
  compressedImageFile = null;
  editingImageUrl = ''; currentUnits = [];
  addUnit({ label:'piece', retail:'', wholesale:'', stock:'', size:'' });
  document.getElementById('pFormTitle').textContent = '➕ Naya Product';
}

async function saveProduct() {
  const name = document.getElementById('pName').value.trim();
  const cat = document.getElementById('pCat').value.trim();
  const editId = document.getElementById('pId').value;
  if (!name) return toast('Naam zaroori');
  for (const u of currentUnits) if (!u.retail) return toast(`${u.label} retail daalo`);

  const units = currentUnits.map(u => ({
    label: u.label, retail: +u.retail || 0,
    wholesale: +u.wholesale || +u.retail, stock: +u.stock || 0,
    size: u.size || ''
  }));

  try {
    toast('Save ho raha hai...');
    let imageUrl = editingImageUrl;
    if (compressedImageFile) {
      toast('📤 Image upload...');
      imageUrl = await uploadImage(compressedImageFile);
    }
    let product;
    if (editId) {
      product = DATA.products.find(x => x.id === editId);
      Object.assign(product, { name, units, category: cat, image: imageUrl });
    } else {
      product = { id: uid(), name, units, image: imageUrl, category: cat, hidden: false, created_at: new Date().toISOString() };
    }
    await fbSaveProduct(product);
    DATA = await loadData();
    toast('✅ Save ho gaya');
    resetProductForm();
    renderProducts();
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

function editProduct(id) {
  const p = DATA.products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pId').value = p.id;
  document.getElementById('pName').value = p.name;
  document.getElementById('pCat').value = p.category || '';
  editingImageUrl = p.image || '';
  compressedImageFile = null;
  const prev = document.getElementById('pPreview');
  const status = document.getElementById('imgStatus');
  if (p.image) {
    prev.src = p.image;
    prev.style.display = 'block';
    status.textContent = '📷 Existing image';
    status.className = 'img-status';
  } else {
    prev.style.display = 'none';
    status.textContent = '';
    status.className = 'img-status';
  }
  currentUnits = (p.units||[]).map(u => ({...u, size: u.size || ''}));
  if (!currentUnits.length) currentUnits = [{label:'piece',retail:'',wholesale:'',stock:'',size:''}];
  renderUnits();
  document.getElementById('pFormTitle').textContent = '✏️ Edit';
  switchTab('products');
}

async function deleteProduct(id) {
  if (!confirm('Delete?')) return;
  try { await fbDeleteProduct(id); DATA = await loadData(); toast('🗑️ Delete'); renderProducts(); }
  catch (e) { toast('❌ ' + e.message); }
}

async function toggleHide(id) {
  const p = DATA.products.find(x => x.id === id);
  p.hidden = !p.hidden;
  try { await fbSaveProduct(p); DATA = await loadData(); renderProducts(); }
  catch (e) { toast('❌ ' + e.message); }
}

function renderProducts() {
  const q = (document.getElementById('pSearch').value||'').toLowerCase();
  const list = document.getElementById('productList');
  const items = DATA.products.filter(p => p.name.toLowerCase().includes(q));
  if (!items.length) { list.innerHTML = '<div class="card center">Koi product nahi</div>'; return; }
  list.innerHTML = items.map(p => {
    const rows = (p.units||[]).map(u => {
      const typeLabel = u.size ? ' 📦 Packet' : (['kg','gram','liter','ml'].includes(u.label) ? ' ⚖️ Khula' : '');
      return `
      <div style="font-size:13px;padding:3px 0;">
        <b>${u.label}${typeLabel}</b>: ${inr(u.retail)} <span style="color:#777;">(W ${inr(u.wholesale)})</span> — Stock: ${u.stock}
      </div>`;
    }).join('');
    return `
    <div class="card">
      <div class="row">
        <img src="${p.image || 'https://via.placeholder.com/80'}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;flex:0 0 80px;">
        <div style="flex:1;">
          <div style="font-weight:600;">${p.name} ${p.hidden?'<span style="color:#c62828;font-size:12px;">(Hidden)</span>':''}</div>
          <div style="font-size:12px;color:#777;">${p.category||'-'}</div>
        </div>
      </div>
      <div class="mt">${rows}</div>
      <div class="row mt">
        <button class="primary small" onclick="editProduct('${p.id}')">✏️</button>
        <button class="primary small" style="background:#f57c00;" onclick="toggleHide('${p.id}')">${p.hidden?'👁️':'🙈'}</button>
        <button class="primary small danger" onclick="deleteProduct('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('pSearch').oninput = renderProducts;

/* ================= ORDERS ================= */
async function approvePayment(orderId) {
  if (!confirm('Payment confirm?')) return;
  try {
    const o = DATA.orders.find(x => x.id === orderId);
    const history = o.history || [];
    history.push({ at: new Date().toISOString(), by: 'owner', action: 'payment_confirmed' });
    await fbUpdateOrder(orderId, { payment_status: 'paid', owner_confirmed_at: new Date().toISOString(), history });
    DATA = await loadData(); toast('✅ Payment confirm'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}

async function approveOrder(orderId) {
  if (!confirm('Order approve?')) return;
  try {
    const o = DATA.orders.find(x => x.id === orderId);
    const history = o.history || [];
    history.push({ at: new Date().toISOString(), by: 'owner', action: 'order_approved' });
    await fbUpdateOrder(orderId, { order_status: 'approved', owner_approved: true, history });
    DATA = await loadData(); toast('✅ Order approve'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}

async function markDelivered(orderId) {
  if (!confirm('Delivered mark?')) return;
  try {
    const o = DATA.orders.find(x => x.id === orderId);
    const history = o.history || [];
    history.push({ at: new Date().toISOString(), by: 'owner', action: 'delivered' });
    await fbUpdateOrder(orderId, { order_status: 'delivered', history });
    DATA = await loadData(); toast('✅ Delivered'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}

function renderOrders() {
  const list = document.getElementById('orderList');
  if (!DATA.orders.length) { list.innerHTML = '<div class="card center">Koi order nahi</div>'; return; }
  list.innerHTML = DATA.orders.map(o => {
    const items = (o.items || []).map(it => {
      const p = DATA.products.find(x => x.id === it.product_id) || { name: it.product_name || '?' };
      const unitDisplay = it.size ? `${it.unit} (Packet)` : it.unit;
      return `<div style="font-size:13px;">• ${p.name} — ${it.qty} ${unitDisplay} × ${inr(it.price)} = ${inr(it.price*it.qty)}</div>`;
    }).join('');
    const isPaid = o.payment_status === 'paid';
    const isApproved = o.order_status === 'approved' || o.order_status === 'delivered';
    const isDelivered = o.order_status === 'delivered';
    return `
      <div class="card" style="border-left:4px solid ${isDelivered?'#2e7d32':isPaid?'#1976d2':'#f57c00'};">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <b>${o.user_name||'?'}</b>
            <div style="font-size:11px;color:#666;">📞 ${o.user_phone||''}</div>
          </div>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn btn-call" onclick="callPhone('${o.user_phone}')">📞</button>
            <button class="icon-btn btn-wa" onclick="whatsappPhone('${o.user_phone}', 'Namaste ${o.user_name}, Dukan se')">💬</button>
          </div>
        </div>
        <div style="font-size:11px;color:#888;text-align:right;">${new Date(o.created_at).toLocaleString('hi-IN')}</div>
        <div class="mt">${items}</div>
        ${o.extra_charge > 0 ? `<div style="font-size:12px;color:#e65100;margin-top:4px;">Subtotal: ${inr(o.subtotal)} + Online Fee: ${inr(o.extra_charge)}</div>` : ''}
        <div style="font-weight:bold;color:#2e7d32;margin-top:6px;font-size:16px;">Total: ${inr(o.total)}</div>
        <div style="font-size:13px;margin-top:6px;background:#f9f9f9;padding:8px;border-radius:6px;">
          <div>📦 Order: <b style="color:${isDelivered?'#2e7d32':isApproved?'#1976d2':'#e65100'};">${isDelivered?'✅ DELIVERED':isApproved?'📦 APPROVED':'⏳ PENDING'}</b></div>
          <div>💰 Payment: <b style="color:${isPaid?'#2e7d32':'#e65100'};">${isPaid?'✅ PAID':'⏳ PENDING'}</b></div>
          <div>Mode: <b>${(o.payment_mode||'cash').toUpperCase()}</b></div>
        </div>
        <div class="row mt">
          ${!isPaid ? `<button class="primary small" style="background:#2e7d32;" onclick="approvePayment('${o.id}')">💰 Payment Confirm</button>` : ''}
          ${isPaid && !isApproved ? `<button class="primary small" style="background:#1976d2;" onclick="approveOrder('${o.id}')">📦 Approve</button>` : ''}
          ${isApproved && !isDelivered ? `<button class="primary small" onclick="markDelivered('${o.id}')">✅ Delivered</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

function setUdharType(type) {
  udharBuilder.type = type;
  renderUdharBuilder();
}

function onProductSelect(productId) {
  const p = DATA.products.find(x => x.id === productId);
  const row = document.getElementById('itemUnitRow');
  const sel = document.getElementById('itemUnitSel');
  
  if (!p) { row.style.display = 'none'; return; }
  
  row.style.display = 'block';
  sel.innerHTML = p.units.map(u => `
    <option value="${u.label}">${u.label}${u.size ? ' (Packet)' : ''} — ₹${u.retail}</option>
  `).join('');
  
  updateItemPrice();
}

function updateItemPrice() {
  const productId = document.getElementById('itemProductSel').value;
  const unitLabel = document.getElementById('itemUnitSel').value;
  const p = DATA.products.find(x => x.id === productId);
  if (!p) return;
  const u = p.units.find(x => x.label === unitLabel);
  if (!u) return;
  
  const qty = parseFloat(document.getElementById('itemQtyInput').value) || 1;
  const subtotal = u.retail * qty;
  document.getElementById('itemSubtotal').textContent = '₹' + subtotal.toFixed(2);
}

function updateItemSubtotal() {
  updateItemPrice();
}

function addItemToUdhar() {
  const productId = document.getElementById('itemProductSel').value;
  const unitLabel = document.getElementById('itemUnitSel').value;
  const qty = parseFloat(document.getElementById('itemQtyInput').value) || 0;

  if (!productId) return toast('Saman select karo');
  if (!unitLabel) return toast('Unit select karo');
  if (qty <= 0) return toast('Qty daalo');

  const p = DATA.products.find(x => x.id === productId);
  const u = p.units.find(x => x.label === unitLabel);
  if (!u) return toast('Unit nahi mila');

  const amount = u.retail * qty;

  udharBuilder.items.push({
    product_id: productId,
    product_name: p.name,
    unit: unitLabel,
    has_size: u.size ? true : false,
    qty: qty,
    price: u.retail,
    amount: amount,
    name: `${p.name} (${qty} ${unitLabel})`
  });

  // Reset add section
  document.getElementById('itemProductSel').value = '';
  document.getElementById('itemQtyInput').value = 1;
  document.getElementById('itemUnitRow').style.display = 'none';
  document.getElementById('itemSubtotal').textContent = '₹0';

  renderUdharBuilder();
}

function removeUdharItem(idx) {
  udharBuilder.items.splice(idx, 1);
  renderUdharBuilder();
}

function updateUdharItemAmount(idx, val) {
  const amt = parseFloat(val) || 0;
  udharBuilder.items[idx].amount = amt;
  renderUdharBuilder();
}

function closeUdharModal() {
  document.getElementById('udharModalRoot').innerHTML = '';
  udharBuilder = { user_id: '', type: 'udhar', items: [], note: '', date: '' };
}

async function saveUdharEntry() {
  const user_id = udharBuilder.user_id || document.getElementById('udUserSel').value;
  if (!user_id) return toast('Customer select karo');
  
  const note = document.getElementById('udNoteInput').value.trim();
  const totalAmount = udharBuilder.items.reduce((sum, item) => sum + (+item.amount || 0), 0);
  
  if (totalAmount <= 0) return toast('Kuch saman ya amount daalo');

  const u = DATA.users.find(x => x.id === user_id);
  if (!u) return toast('Customer nahi mila');
  
  const dateVal = udharBuilder.date || document.getElementById('udDateInput').value;
  const now = dateVal ? new Date(dateVal + 'T' + new Date().toTimeString().split(' ')[0]) : new Date();

  const rec = {
    id: uid(),
    user_id: user_id,
    user_name: u.name,
    user_phone: u.phone,
    amount: totalAmount,
    items: udharBuilder.items,
    note: note || (udharBuilder.type === 'jama' ? 'Payment jama' : 'Udhar'),
    type: udharBuilder.type,
    status: udharBuilder.type === 'jama' ? 'paid' : 'pending',
    created_at: now.toISOString(),
    date_str: now.toISOString().split('T')[0],
    time_str: now.toTimeString().slice(0,5),
    year: now.getFullYear(),
    month: now.getMonth() + 1,
    day: now.getDate()
  };

  try {
    await fbSaveUdhar(rec);
    DATA = await loadData();
    toast(udharBuilder.type === 'jama' ? '✅ Jama likh diya' : '✅ Udhar likh diya');
    closeUdharModal();
    renderUdhar();
  } catch (e) { toast('❌ ' + e.message); }
}

function renderUdhar() {
  const list = document.getElementById('udharCustomerList');
  const searchEl = document.getElementById('udCustomerSearch');
  const q = (searchEl.value || '').toLowerCase();

  const byCustomer = {};
  DATA.udhar.forEach(u => {
    if (!byCustomer[u.user_id]) {
      byCustomer[u.user_id] = {
        user_id: u.user_id,
        user_name: u.user_name,
        user_phone: u.user_phone,
        entries: [],
        total_udhar: 0,
        total_jama: 0
      };
    }
    byCustomer[u.user_id].entries.push(u);
    const isJama = u.type === 'jama' || u.status === 'paid';
    if (isJama) {
      byCustomer[u.user_id].total_jama += +u.amount || 0;
    } else {
      byCustomer[u.user_id].total_udhar += +u.amount || 0;
    }
  });

  const customerList = Object.values(byCustomer).map(c => {
    c.balance = c.total_udhar - c.total_jama;
    return c;
  }).filter(c => {
    if (!q) return true;
    return (c.user_name || '').toLowerCase().includes(q) || (c.user_phone || '').includes(q);
  });

  customerList.sort((a, b) => b.balance - a.balance);

  if (!customerList.length) {
    list.innerHTML = '<div class="center" style="padding:20px;color:#888;">Koi udhar nahi. ➕ Naya Udhar dabao.</div>';
  } else {
    list.innerHTML = customerList.map(c => {
      const isAdvance = c.balance < 0;
      const isClear = c.balance === 0;
      const balanceColor = isAdvance ? '#2e7d32' : (isClear ? '#666' : '#c62828');
      const balanceText = isAdvance 
        ? `💚 ₹${Math.abs(c.balance).toFixed(2)} Advance` 
        : (isClear ? '✅ Clear' : `📕 ₹${c.balance.toFixed(2)} Baaki`);

      return `
        <div style="padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;" onclick="openCustomerLedger('${c.user_id}')">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="flex:1;">
              <div style="font-weight:bold;font-size:15px;">${c.user_name}</div>
              <div style="font-size:12px;color:#666;">📞 ${c.user_phone}</div>
              <div style="font-size:11px;color:#999;margin-top:2px;">
                📕 ₹${c.total_udhar.toFixed(0)} udhar • 💚 ₹${c.total_jama.toFixed(0)} jama
              </div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:bold;color:${balanceColor};font-size:15px;">${balanceText}</div>
              <div style="font-size:11px;color:#888;margin-top:2px;">${c.entries.length} entries ›</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;margin-top:8px;">
            <button class="primary small" style="background:#e65100;font-size:12px;padding:6px;" onclick="event.stopPropagation(); openAddUdharModal('${c.user_id}')">📕 Udhar</button>
            <button class="primary small" style="background:#2e7d32;font-size:12px;padding:6px;" onclick="event.stopPropagation(); openJamaModal('${c.user_id}')">💚 Jama</button>
            <button class="primary small" style="background:#1976d2;font-size:12px;padding:6px;" onclick="event.stopPropagation(); callPhone('${c.user_phone}')">📞</button>
            <button class="primary small" style="background:#25d366;font-size:12px;padding:6px;" onclick="event.stopPropagation(); whatsappPhone('${c.user_phone}', 'Namaste ${c.user_name}, aapka udhar ₹${c.balance.toFixed(2)} hai')">💬</button>
          </div>
        </div>`;
    }).join('');
  }

  const totals = Object.values(byCustomer).reduce((acc, c) => {
    const bal = c.total_udhar - c.total_jama;
    if (bal > 0) acc.pending += bal;
    else acc.advance += Math.abs(bal);
    return acc;
  }, { pending: 0, advance: 0 });

  document.getElementById('udTotalPending').textContent = '₹' + totals.pending.toFixed(0);
  document.getElementById('udTotalAdvance').textContent = '₹' + totals.advance.toFixed(0);
  document.getElementById('udTotalCustomers').textContent = Object.keys(byCustomer).length;
}

document.getElementById('udCustomerSearch').oninput = renderUdhar;

function openCustomerLedger(userId) {
  const u = DATA.users.find(x => x.id === userId);
  if (!u) return;

  const entries = DATA.udhar.filter(x => x.user_id === userId)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  let runningBalance = 0;
  const ledger = entries.map(e => {
    const isJama = e.type === 'jama' || e.status === 'paid';
    if (isJama) {
      runningBalance -= +e.amount;
    } else {
      runningBalance += +e.amount;
    }
    return { ...e, running: runningBalance, isJama };
  });

  ledger.reverse();

  const totalUdhar = entries.filter(e => !(e.type === 'jama' || e.status === 'paid')).reduce((a, e) => a + +e.amount, 0);
  const totalJama = entries.filter(e => e.type === 'jama' || e.status === 'paid').reduce((a, e) => a + +e.amount, 0);
  const finalBalance = totalUdhar - totalJama;

  document.getElementById('udharModalRoot').innerHTML = `
    <div class="modal-udhar-bg" onclick="if(event.target===this) closeUdharModal()">
      <div class="modal-udhar">
        
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div>
            <h3 style="margin:0;">📔 ${u.name}</h3>
            <div style="font-size:12px;color:#666;">📞 ${u.phone}</div>
          </div>
          <button class="primary small" style="width:auto;background:#777;padding:6px 10px;" onclick="closeUdharModal()">✕</button>
        </div>

        <div style="background:${finalBalance > 0 ? '#ffebee' : finalBalance < 0 ? '#e8f5e9' : '#f5f5f5'};padding:12px;border-radius:8px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;">
            <span>📕 Total Udhar:</span><b>₹${totalUdhar.toFixed(2)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;">
            <span>💚 Total Jama:</span><b>₹${totalJama.toFixed(2)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;color:${finalBalance > 0 ? '#c62828' : finalBalance < 0 ? '#2e7d32' : '#333'};margin-top:8px;padding-top:8px;border-top:1px solid rgba(0,0,0,0.1);">
            <span>${finalBalance > 0 ? '📕 Baaki:' : finalBalance < 0 ? '💚 Advance:' : '✅ Clear:'}</span>
            <b>₹${Math.abs(finalBalance).toFixed(2)}</b>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button class="primary small" style="background:#e65100;" onclick="openAddUdharModal('${userId}')">📕 Naya Udhar</button>
          <button class="primary small" style="background:#2e7d32;" onclick="openJamaModal('${userId}')">💚 Jama Karo</button>
        </div>

        <div style="font-size:13px;font-weight:bold;color:#666;margin-bottom:8px;">📋 Poora Hisaab (Latest upar)</div>
        <div style="background:#f9f9f9;border-radius:8px;padding:4px;">
          ${ledger.length === 0 ? '<div style="padding:20px;text-align:center;color:#888;">Koi entry nahi</div>' : ledger.map(e => {
            const d = new Date(e.created_at);
            const dateStr = d.toLocaleDateString('hi-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = d.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
            
            // Items list
            const itemsList = (e.items && e.items.length) 
              ? e.items.map(it => `<div style="font-size:11px;color:#555;padding-left:14px;">• ${it.name || (it.product_name + ' × ' + it.qty + ' ' + it.unit)} = ₹${(+it.amount).toFixed(2)}</div>`).join('')
              : '';
            
            return `
              <div class="ledger-entry ${e.isJama ? 'jama' : 'udhar'}">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                  <div style="flex:1;">
                    <div style="font-size:11px;color:#888;">
                      📅 ${dateStr} • ⏰ ${timeStr}
                    </div>
                    <div style="font-size:13px;font-weight:600;margin-top:2px;">
                      ${e.isJama ? '💚' : '📕'} ${e.note}
                    </div>
                    ${itemsList}
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:15px;font-weight:bold;color:${e.isJama ? '#2e7d32' : '#c62828'};">
                      ${e.isJama ? '−' : '+'} ₹${(+e.amount).toFixed(2)}
                    </div>
                    <div style="font-size:11px;color:#666;margin-top:2px;">
                      Balance: ₹${(+e.running).toFixed(2)}
                    </div>
                  </div>
                </div>
                <div style="margin-top:6px;display:flex;gap:6px;">
                  <button class="primary small" style="background:#1976d2;font-size:11px;padding:4px 8px;width:auto;" onclick="editUdharEntry('${e.id}', '${userId}')">✏️ Edit</button>
                  <button class="primary small danger" style="font-size:11px;padding:4px 8px;width:auto;" onclick="deleteUdharEntry('${e.id}', '${userId}')">🗑️</button>
                </div>
              </div>`;
          }).join('')}
        </div>

        <button class="primary" style="background:#777;margin-top:12px;" onclick="closeUdharModal()">Close</button>
      </div>
    </div>`;
}

function openJamaModal(customerId) {
  openAddUdharModal(customerId);
  setTimeout(() => {
    setUdharType('jama');
  }, 100);
}

async function editUdharEntry(id, userId) {
  const e = DATA.udhar.find(x => x.id === id);
  if (!e) return;
  const newAmt = prompt('Amount badlo:', e.amount);
  if (newAmt === null) return;
  const newNote = prompt('Note badlo:', e.note);
  if (newNote === null) return;

  const amt = parseFloat(newAmt);
  if (!amt || amt <= 0) return toast('Invalid amount');

  try {
    await FB.collection('udhar').doc(id).set({
      amount: amt,
      note: newNote,
      updated_at: new Date().toISOString()
    }, { merge: true });
    DATA = await loadData();
    toast('✅ Update ho gaya');
    closeUdharModal();
    setTimeout(() => openCustomerLedger(userId), 200);
    renderUdhar();
  } catch (err) { toast('❌ ' + err.message); }
}

async function deleteUdharEntry(id, userId) {
  if (!confirm('Ye entry delete karni hai?')) return;
  try {
    await FB.collection('udhar').doc(id).delete();
    DATA = await loadData();
    toast('🗑️ Delete ho gaya');
    closeUdharModal();
    renderUdhar();
  } catch (err) { toast('❌ ' + err.message); }
}

init();
</script>
