<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Owner Panel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <style>
    .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; font-size:18px; margin-right:4px; }
    .btn-call { background:#2e7d32; color:#fff; }
    .btn-wa { background:#25d366; color:#fff; }
    .btn-sms { background:#1976d2; color:#fff; }
    
    .media-btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .media-btn {
      flex: 1; padding: 14px 8px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      transition: transform 0.1s;
    }
    .media-btn:active { transform: scale(0.97); opacity: 0.85; }
    .btn-cam { background: #2e7d32; }
    .btn-gal { background: #1976d2; }
    
    .img-status { 
      font-size: 12px; color: #666; margin-top: 8px; text-align: center;
      min-height: 16px; padding: 4px; border-radius: 4px;
    }
    .img-status.success { background: #e8f5e9; color: #2e7d32; font-weight: bold; }
    .img-status.error { background: #ffebee; color: #c62828; }
    
    #pPreview {
      max-width: 100%; margin-top: 8px; border-radius: 8px; display: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); max-height: 300px;
      object-fit: contain; background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>👨‍💼 Owner</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card" style="display:flex;padding:0;overflow:auto;">
      <button class="primary tabBtn" data-tab="products" style="border-radius:0;font-size:12px;">Products</button>
      <button class="primary tabBtn" data-tab="users" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Customers</button>
      <button class="primary tabBtn" data-tab="orders" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Orders</button>
      <button class="primary tabBtn" data-tab="udhar" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">Udhar</button>
      <button class="primary tabBtn" data-tab="info" style="border-radius:0;background:#ccc;color:#333;font-size:12px;">ℹ️</button>
    </div>

    <div id="tab-products">
      <div class="card">
        <h3 id="pFormTitle">➕ Naya Product</h3>
        <input type="hidden" id="pId">
        <input id="pName" placeholder="Product name">
        
        <!-- Gallery input -->
        <input id="pImgGallery" type="file" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
        <!-- Camera input -->
        <input id="pImgCamera" type="file" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelect(event)">
        
        <div class="media-btn-row">
          <button type="button" class="media-btn btn-cam" onclick="openCamera()">📷 Camera</button>
          <button type="button" class="media-btn btn-gal" onclick="openGallery()">🖼️ Gallery</button>
        </div>
        
        <div id="imgStatus" class="img-status"></div>
        <img id="pPreview" alt="Preview">
        
        <input id="pCat" placeholder="Category">
        <label style="font-size:13px;font-weight:bold;color:#2e7d32;margin-top:8px;display:block;">Units & Price</label>
        <div id="unitList"></div>
        <button class="primary" style="background:#1976d2;" onclick="addUnit()">➕ Unit</button>
        <button class="primary" onclick="saveProduct()">💾 Save</button>
        <button class="primary" style="background:#777;" onclick="resetProductForm()">Reset</button>
      </div>
      <input class="search-bar" id="pSearch" placeholder="🔍 Search">
      <div id="productList"></div>
    </div>

    <div id="tab-users" class="hidden">
      <input class="search-bar" id="uSearch" placeholder="🔍 Customer (naam ya phone)">
      <div id="userList"></div>
    </div>

    <div id="tab-orders" class="hidden">
      <div id="orderList"></div>
    </div>

    <div id="tab-udhar" class="hidden">
      <div class="card">
        <h3>➕ Naya Udhar</h3>
        <select id="udUser" style="margin-bottom:6px;"></select>
        <input id="udAmount" type="number" placeholder="Amount ₹" inputmode="numeric">
        <input id="udNote" placeholder="Note (jaise: Aata 5kg udhar)">
        <button class="primary" onclick="addUdhar()">💾 Add Udhar</button>
      </div>
      <h3>📋 Udhar List</h3>
      <div id="udharList"></div>
    </div>

    <div id="tab-info" class="hidden">
      <div class="card">
        <h3>ℹ️ Info</h3>
        <div id="secretInfo" style="font-size:13px;color:#555;"></div>
        
        <div style="margin-top:12px;padding:10px;background:#f9f9f9;border-radius:8px;">
          <div style="font-size:12px;color:#666;margin-bottom:6px;">
            <b>Mode:</b> <span id="modeInfo">Checking...</span>
          </div>
          <button class="primary" style="background:#1976d2;" onclick="enableNotifications()">
            🔔 Enable Order Notifications
          </button>
          <div id="notifStatus" style="font-size:12px;color:#666;margin-top:8px;text-align:center;min-height:16px;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
