<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owner Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<style>
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;font-size:18px;margin-right:4px;}
.btn-call{background:#2e7d32;color:#fff;}
.btn-wa{background:#25d366;color:#fff;}
.btn-sms{background:#1976d2;color:#fff;}
.pick-btn{width:100%;padding:14px;border:2px dashed #1976d2;border-radius:10px;font-size:15px;font-weight:bold;color:#1976d2;background:#e3f2fd;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;}
.img-status{font-size:13px;color:#666;margin-top:8px;text-align:center;min-height:18px;padding:6px;border-radius:6px;}
.img-status.success{background:#e8f5e9;color:#2e7d32;font-weight:bold;}
.img-status.error{background:#ffebee;color:#c62828;}
#pPreview{max-width:100%;margin-top:10px;border-radius:10px;display:none;max-height:280px;object-fit:contain;width:100%;}
#cameraModal{display:none;position:fixed;inset:0;background:#000;z-index:1000;flex-direction:column;}
#cameraVideo{flex:1;width:100%;object-fit:cover;}
.camera-controls{padding:16px;background:#000;display:flex;gap:10px;justify-content:center;}
.cam-btn{padding:14px 20px;border:none;border-radius:50px;font-size:15px;font-weight:bold;color:#fff;cursor:pointer;}
.cam-cancel{background:#666;}.cam-capture{background:#2e7d32;padding:14px 36px;font-size:17px;}.cam-switch{background:#1976d2;}
#cameraCanvas{display:none;}
.type-option{display:flex;gap:10px;margin-top:8px;}
.type-option button{flex:1;padding:14px 8px;border:2px solid #ddd;border-radius:10px;background:#fff;font-weight:bold;color:#333;cursor:pointer;font-size:14px;}
.type-option button.active{border-color:#2e7d32;background:#e8f5e9;color:#2e7d32;}
.udhar-item{display:flex;gap:8px;align-items:center;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:6px;}
.udhar-item .info{flex:1;}
.udhar-item .amount{font-weight:bold;color:#2e7d32;font-size:15px;min-width:70px;text-align:right;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500;padding:12px;}
.modal-box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:500px;max-height:94vh;overflow-y:auto;}
.tab-btn-active{background:#2e7d32 !important;color:#fff !important;}
.tab-btn-inactive{background:#ccc !important;color:#333 !important;}
</style>
</head>
<body>
<div class="header">
<h1>👨‍💼 Owner</h1>
<button onclick="logout()">Logout</button>
</div>

<div class="container">
<div class="card" style="display:flex;padding:0;overflow:auto;">
<button class="primary tabBtn" data-tab="products">Products</button>
<button class="primary tabBtn" data-tab="users">Customers</button>
<button class="primary tabBtn" data-tab="orders">Orders</button>
<button class="primary tabBtn" data-tab="udhar">Udhar</button>
<button class="primary tabBtn" data-tab="info">ℹ️</button>
</div>

<!-- PRODUCTS -->
<div id="tab-products">
<div class="card">
<h3 id="pFormTitle">➕ Naya Product</h3>
<input type="hidden" id="pId">
<input id="pName" placeholder="Product name (jaise: Aata)">
<input id="pCat" placeholder="Category (optional)">

<label style="font-size:13px;font-weight:bold;color:#2e7d32;margin-top:10px;display:block;">Is product ka type:</label>
<div class="type-option">
  <button type="button" id="typeLooseBtn" onclick="setProductType('loose')">
    ⚖️ Khula<br><span style="font-size:11px;font-weight:normal;">(kg/gm — naap ke becho)</span>
  </button>
  <button type="button" id="typePacketBtn" onclick="setProductType('packet')">
    📦 Packet<br><span style="font-size:11px;font-weight:normal;">(fixed — pura packet)</span>
  </button>
</div>
<input type="hidden" id="pType" value="loose">

<label style="font-size:13px;font-weight:bold;color:#2e7d32;margin-top:10px;display:block;">Unit:</label>
<select id="pUnit" onchange="onUnitChange()">
  <option value="kg">kg (kilogram)</option>
  <option value="gram">gram</option>
  <option value="liter">liter</option>
  <option value="ml">ml</option>
  <option value="piece">piece (nag)</option>
  <option value="packet">packet</option>
  <option value="bottle">bottle</option>
  <option value="dozen">dozen</option>
  <option value="box">box</option>
  <option value="strip">strip</option>
</select>

<div class="row">
  <input id="pRetail" type="number" placeholder="Retail ₹" inputmode="decimal">
  <input id="pWholesale" type="number" placeholder="Wholesale ₹" inputmode="decimal">
</div>
<input id="pStock" type="number" placeholder="Stock (kitna hai)" inputmode="decimal">

<div style="display:flex;gap:8px;margin-top:10px;">
  <button type="button" class="pick-btn" style="flex:1;background:#e8f5e9;border-color:#2e7d32;color:#2e7d32;margin:0;" onclick="openLiveCamera()">📷 Camera</button>
  <label for="pImgGallery" class="pick-btn" style="flex:1;margin:0;">🖼️ Gallery</label>
</div>
<input id="pImgGallery" type="file" accept="image/*" onchange="handleImageSelect(event)" style="display:none;">
<div id="imgStatus" class="img-status"></div>
<img id="pPreview">

<button class="primary" onclick="saveProduct()">💾 Save Product</button>
<button class="primary" style="background:#777;" onclick="resetProductForm()">Reset</button>
</div>

<input class="search-bar" id="pSearch" placeholder="🔍 Search">
<div id="productList"></div>
</div>

<!-- USERS -->
<div id="tab-users" class="hidden">
<input class="search-bar" id="uSearch" placeholder="🔍 Customer">
<div id="userList"></div>
</div>

<!-- ORDERS -->
<div id="tab-orders" class="hidden">
<div id="orderList"></div>
</div>

<!-- UDHAR -->
<div id="tab-udhar" class="hidden">
<div class="card" style="background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;">
  <h3 style="color:#fff;">💰 Udhar Khata</h3>
  <div style="display:flex;justify-content:space-around;text-align:center;margin-top:8px;">
    <div><div style="font-size:22px;font-weight:bold;" id="udTotalPending">₹0</div><div style="font-size:11px;">📕 Baaki</div></div>
    <div><div style="font-size:22px;font-weight:bold;" id="udTotalAdvance">₹0</div><div style="font-size:11px;">💚 Advance</div></div>
    <div><div style="font-size:22px;font-weight:bold;" id="udTotalCustomers">0</div><div style="font-size:11px;">👥 Customers</div></div>
  </div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <h3 style="margin:0;">👥 Customers</h3>
    <button class="primary small" style="width:auto;padding:8px 14px;background:#1976d2;" onclick="openNewUdhar()">➕ Naya Udhar</button>
  </div>
  <input class="search-bar" id="udCustomerSearch" placeholder="🔍 Customer dhundo" style="margin-bottom:10px;">
  <div id="udharCustomerList"></div>
</div>
</div>

<!-- INFO -->
<div id="tab-info" class="hidden">
<div class="card">
<h3>ℹ️ Info</h3>
<div id="secretInfo" style="font-size:13px;color:#555;"></div>
</div>
</div>
</div>

<!-- Udhar Modal -->
<div id="udharModalRoot"></div>
<!-- Camera Modal -->
<div id="cameraModal">
  <video id="cameraVideo" autoplay playsinline muted></video>
  <div class="camera-controls">
    <button type="button" class="cam-btn cam-cancel" onclick="closeCamera()">✕ Cancel</button>
    <button type="button" class="cam-btn cam-capture" onclick="capturePhoto()">📸 Capture</button>
    <button type="button" class="cam-btn cam-switch" onclick="switchCamera()">🔄</button>
  </div>
</div>
<canvas id="cameraCanvas"></canvas>

<script src="app.js"></script>
<script>
const s = getSession();
if (!s || s.role !== 'owner') location.replace('index.html');

let DATA = null, editingImageUrl = '', compressedImageFile = null;
let udharBuilder = { user_id: '', type: 'udhar', items: [], note: '' };

async function init() {
  const ok = await waitForFirebase();
  if (!ok) { alert('Firebase ready nahi'); return; }
  const uid = await waitForAuth();
  if (!uid) { alert('Session expire'); location.replace('index.html'); return; }
  DATA = await loadData();
  renderProducts(); renderUsers(); renderOrders(); renderUdhar(); renderInfo();
  resetProductForm();
  setProductType('loose');
}

function switchTab(t) {
  document.querySelectorAll('.tabBtn').forEach(b => {
    b.classList.toggle('tab-btn-active', b.dataset.tab === t);
    b.classList.toggle('tab-btn-inactive', b.dataset.tab !== t);
  });
  ['products','users','orders','udhar','info'].forEach(x => {
    document.getElementById('tab-'+x).classList.toggle('hidden', x !== t);
  });
}
document.querySelectorAll('.tabBtn').forEach(btn => {
  btn.onclick = () => switchTab(btn.dataset.tab);
});

function renderInfo() {
  document.getElementById('secretInfo').innerHTML = `
    <div style="padding:4px 0;">ImgBB: ${SECRET.imgbb_key ? '✅' : '❌'}</div>
    <div style="padding:4px 0;">UPI: ${SECRET.upi_id || '❌'}</div>
    <div style="padding:4px 0;">Firebase: ${FB_READY ? '✅ ready' : '❌'}</div>
  `;
}

/* ========== PRODUCT TYPE ========== */
function setProductType(type) {
  document.getElementById('pType').value = type;
  if (type === 'loose') {
    document.getElementById('typeLooseBtn').classList.add('active');
    document.getElementById('typePacketBtn').classList.remove('active');
    // Unit options for loose
    const u = document.getElementById('pUnit');
    u.innerHTML = `
      <option value="kg">kg (kilogram)</option>
      <option value="gram">gram</option>
      <option value="liter">liter</option>
      <option value="ml">ml</option>
    `;
  } else {
    document.getElementById('typePacketBtn').classList.add('active');
    document.getElementById('typeLooseBtn').classList.remove('active');
    const u = document.getElementById('pUnit');
    u.innerHTML = `
      <option value="piece">piece (nag)</option>
      <option value="packet">packet</option>
      <option value="bottle">bottle</option>
      <option value="dozen">dozen</option>
      <option value="box">box</option>
      <option value="strip">strip</option>
    `;
  }
}

function onUnitChange() {}

/* ========== SAVE PRODUCT ========== */
async function saveProduct() {
  const name = document.getElementById('pName').value.trim();
  const cat = document.getElementById('pCat').value.trim();
  const type = document.getElementById('pType').value;
  const unit = document.getElementById('pUnit').value;
  const retail = parseFloat(document.getElementById('pRetail').value) || 0;
  const wholesale = parseFloat(document.getElementById('pWholesale').value) || retail;
  const stock = parseFloat(document.getElementById('pStock').value) || 0;
  const editId = document.getElementById('pId').value;

  if (!name) return toast('Naam daalo');
  if (!retail || retail <= 0) return toast('Retail price daalo');

  try {
    toast('Save ho raha hai...');
    let imageUrl = editingImageUrl;
    if (compressedImageFile) {
      imageUrl = await uploadImage(compressedImageFile);
    }

    let product;
    if (editId) {
      product = DATA.products.find(x => x.id === editId);
      Object.assign(product, { name, category: cat, type, unit, retail, wholesale, stock, image: imageUrl });
    } else {
      product = {
        id: uid(),
        name, category: cat, type, unit,
        retail, wholesale, stock,
        image: imageUrl,
        hidden: false,
        created_at: new Date().toISOString()
      };
    }
    await fbSaveProduct(product);
    DATA = await loadData();
    toast('✅ Save ho gaya');
    resetProductForm();
    renderProducts();
  } catch (e) {
    toast('❌ ' + e.message);
  }
}

function resetProductForm() {
  ['pId','pName','pCat','pRetail','pWholesale','pStock'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pImgGallery').value = '';
  compressedImageFile = null; editingImageUrl = '';
  const prev = document.getElementById('pPreview');
  prev.style.display = 'none'; prev.src = '';
  document.getElementById('imgStatus').textContent = '';
  document.getElementById('pFormTitle').textContent = '➕ Naya Product';
  setProductType('loose');
}

function editProduct(id) {
  const p = DATA.products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('pId').value = p.id;
  document.getElementById('pName').value = p.name || '';
  document.getElementById('pCat').value = p.category || '';
  setProductType(p.type || 'loose');
  document.getElementById('pUnit').value = p.unit || 'kg';
  document.getElementById('pRetail').value = p.retail || '';
  document.getElementById('pWholesale').value = p.wholesale || '';
  document.getElementById('pStock').value = p.stock || 0;
  editingImageUrl = p.image || '';
  compressedImageFile = null;
  if (p.image) {
    const prev = document.getElementById('pPreview');
    prev.src = p.image;
    prev.style.display = 'block';
  }
  document.getElementById('pFormTitle').textContent = '✏️ Edit Product';
  switchTab('products');
}

async function deleteProduct(id) {
  if (!confirm('Delete?')) return;
  try { await fbDeleteProduct(id); DATA = await loadData(); toast('🗑️'); renderProducts(); }
  catch (e) { toast('❌ ' + e.message); }
}

async function toggleHide(id) {
  const p = DATA.products.find(x => x.id === id);
  p.hidden = !p.hidden;
  try { await fbSaveProduct(p); DATA = await loadData(); renderProducts(); }
  catch (e) { toast('❌ ' + e.message); }
}

function renderProducts() {
  const q = (document.getElementById('pSearch').value||'').toLowerCase();
  const list = document.getElementById('productList');
  const items = DATA.products.filter(p => p.name.toLowerCase().includes(q));
  if (!items.length) { list.innerHTML = '<div class="card center">Koi product nahi</div>'; return; }
  list.innerHTML = items.map(p => {
    const typeLabel = p.type === 'loose' ? '⚖️ Khula' : '📦 Packet';
    return `
    <div class="card">
      <div class="row">
        <img src="${p.image || 'https://via.placeholder.com/80'}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;flex:0 0 70px;">
        <div style="flex:1;">
          <div style="font-weight:600;">${p.name} ${p.hidden?'<span style="color:#c62828;font-size:12px;">(Hidden)</span>':''}</div>
          <div style="font-size:12px;color:#777;">${typeLabel} • ${p.unit} • Stock: ${p.stock||0}</div>
          <div style="font-size:14px;color:#2e7d32;font-weight:bold;margin-top:2px;">₹${p.retail}/${p.unit} <span style="color:#777;font-weight:normal;font-size:12px;">(W ₹${p.wholesale})</span></div>
        </div>
      </div>
      <div class="row mt">
        <button class="primary small" onclick="editProduct('${p.id}')">✏️</button>
        <button class="primary small" style="background:#f57c00;" onclick="toggleHide('${p.id}')">${p.hidden?'👁️':'🙈'}</button>
        <button class="primary small danger" onclick="deleteProduct('${p.id}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}
document.getElementById('pSearch').oninput = renderProducts;

/* ========== USERS ========== */
function renderUsers() {
  const q = (document.getElementById('uSearch').value||'').toLowerCase();
  const list = document.getElementById('userList');
  const items = DATA.users.filter(u =>
    (u.name||'').toLowerCase().includes(q) || (u.phone||'').includes(q)
  );
  if (!items.length) { list.innerHTML = '<div class="card center">Koi customer nahi</div>'; return; }
  list.innerHTML = items.map(u => {
    const w = u.price_type === 'wholesale';
    const stats = calculateUserStats(u.id, DATA.orders, DATA.udhar);
    return `
      <div class="card">
        <div style="display:flex;justify-content:space-between;">
          <b>${u.name}</b>
          <span style="font-size:12px;padding:2px 8px;border-radius:10px;background:${w?'#fff3e0':'#e8f5e9'};color:${w?'#e65100':'#2e7d32'};">
            ${w ? '💼 Wholesale' : '🛒 Retail'}
          </span>
        </div>
        <div style="font-size:13px;color:#666;">📞 ${u.phone}</div>
        ${u.address ? `<div style="font-size:12px;color:#888;">📍 ${u.address}</div>` : ''}
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="icon-btn btn-call" onclick="callPhone('${u.phone}')">📞</button>
          <button class="icon-btn btn-wa" onclick="whatsappPhone('${u.phone}', 'Namaste ${u.name}')">💬</button>
          <button class="icon-btn btn-sms" onclick="smsPhone('${u.phone}')">✉️</button>
        </div>
        <div style="display:flex;gap:8px;font-size:13px;margin-top:8px;padding:8px;background:#f9f9f9;border-radius:6px;">
          <div style="flex:1;text-align:center;"><div style="font-weight:bold;color:#2e7d32;">₹${stats.total_orders.toFixed(0)}</div><div style="font-size:11px;color:#666;">Total</div></div>
          <div style="flex:1;text-align:center;"><div style="font-weight:bold;color:#2e7d32;">₹${stats.total_paid.toFixed(0)}</div><div style="font-size:11px;color:#666;">Paid</div></div>
          <div style="flex:1;text-align:center;"><div style="font-weight:bold;color:${stats.total_pending>0?'#e65100':'#2e7d32'};">₹${stats.total_pending.toFixed(0)}</div><div style="font-size:11px;color:#666;">Bakaya</div></div>
        </div>
        <div class="row mt">
          <button class="primary small" style="background:#1976d2;" onclick="editCustomerName('${u.id}')">✏️ Naam</button>
          <button class="primary small" style="background:${w?'#2e7d32':'#f57c00'};" onclick="toggleWholesale('${u.id}')">
            ${w ? '🛒 Retail' : '💼 Wholesale'}
          </button>
        </div>
      </div>`;
  }).join('');
}
document.getElementById('uSearch').oninput = renderUsers;

async function editCustomerName(id) {
  const u = DATA.users.find(x => x.id === id);
  const newName = prompt('Customer ka naam:', u.name);
  if (!newName || !newName.trim()) return;
  u.name = newName.trim();
  try { await fbSaveUser(u); DATA = await loadData(); toast('✅ Save'); renderUsers(); renderUdhar(); }
  catch (e) { toast('❌ ' + e.message); }
}

async function toggleWholesale(id) {
  const u = DATA.users.find(x => x.id === id);
  const newType = u.price_type === 'wholesale' ? 'retail' : 'wholesale';
  if (!confirm(`${u.name} → ${newType.toUpperCase()}?`)) return;
  u.price_type = newType;
  try { await fbSaveUser(u); DATA = await loadData(); toast(newType==='wholesale'?'💼':'🛒'); renderUsers(); }
  catch (e) { toast('❌ ' + e.message); }
}

/* ========== ORDERS ========== */
async function approvePayment(orderId) {
  if (!confirm('Payment confirm?')) return;
  try {
    await fbUpdateOrder(orderId, { payment_status: 'paid', owner_confirmed_at: new Date().toISOString() });
    DATA = await loadData(); toast('✅ Payment confirm'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}
async function approveOrder(orderId) {
  if (!confirm('Order approve?')) return;
  try {
    await fbUpdateOrder(orderId, { order_status: 'approved', owner_approved: true });
    DATA = await loadData(); toast('✅ Approve'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}
async function markDelivered(orderId) {
  if (!confirm('Delivered?')) return;
  try {
    await fbUpdateOrder(orderId, { order_status: 'delivered' });
    DATA = await loadData(); toast('✅ Delivered'); renderOrders();
  } catch (e) { toast('❌ ' + e.message); }
}

function renderOrders() {
  const list = document.getElementById('orderList');
  if (!DATA.orders.length) { list.innerHTML = '<div class="card center">Koi order nahi</div>'; return; }
  list.innerHTML = DATA.orders.map(o => {
    const items = (o.items || []).map(it => `<div style="font-size:13px;">• ${it.product_name} — ${it.qty} ${it.unit} × ₹${it.price} = ₹${(it.qty*it.price).toFixed(2)}</div>`).join('');
    const isPaid = o.payment_status === 'paid';
    const isApproved = o.order_status === 'approved' || o.order_status === 'delivered';
    const isDelivered = o.order_status === 'delivered';
    return `
      <div class="card" style="border-left:4px solid ${isDelivered?'#2e7d32':isPaid?'#1976d2':'#f57c00'};">
        <div style="display:flex;justify-content:space-between;">
          <b>${o.user_name||'?'}</b>
          <div style="display:flex;gap:4px;">
            <button class="icon-btn btn-call" onclick="callPhone('${o.user_phone}')">📞</button>
            <button class="icon-btn btn-wa" onclick="whatsappPhone('${o.user_phone}', 'Namaste ${o.user_name}')">💬</button>
          </div>
        </div>
        <div style="font-size:11px;color:#888;text-align:right;">${new Date(o.created_at).toLocaleString('hi-IN')}</div>
        <div class="mt">${items}</div>
        <div style="font-weight:bold;color:#2e7d32;margin-top:6px;font-size:16px;">Total: ₹${(o.total||0).toFixed(2)}</div>
        <div style="font-size:13px;margin-top:6px;background:#f9f9f9;padding:8px;border-radius:6px;">
          <div>📦 ${isDelivered?'✅ DELIVERED':isApproved?'📦 APPROVED':'⏳ PENDING'}</div>
          <div>💰 ${isPaid?'✅ PAID':'⏳ PENDING'}</div>
        </div>
        <div class="row mt">
          ${!isPaid ? `<button class="primary small" style="background:#2e7d32;" onclick="approvePayment('${o.id}')">💰 Payment</button>` : ''}
          ${isPaid && !isApproved ? `<button class="primary small" style="background:#1976d2;" onclick="approveOrder('${o.id}')">📦 Approve</button>` : ''}
          ${isApproved && !isDelivered ? `<button class="primary small" onclick="markDelivered('${o.id}')">✅ Delivered</button>` : ''}
        </div>
      </div>`;
  }).join('');
}

/* ================= UDHAR NOTEBOOK ================= */
function openNewUdhar(customerId) {
  udharBuilder = { user_id: customerId || '', type: 'udhar', items: [], note: '' };
  renderUdharBuilder();
}

function renderUdharBuilder() {
  const total = udharBuilder.items.reduce((s, it) => s + (+it.amount || 0), 0);
  const isUdhar = udharBuilder.type === 'udhar';

  document.getElementById('udharModalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeUdharModal()">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;">📝 ${isUdhar ? 'Naya Udhar' : 'Payment Jama'}</h3>
          <button class="primary small" style="width:auto;background:#777;" onclick="closeUdharModal()">✕</button>
        </div>

        <label style="font-size:13px;font-weight:bold;">👤 Customer</label>
        <select id="udUserSel" onchange="udharBuilder.user_id = this.value;" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin:6px 0 12px;">
          <option value="">-- Select --</option>
          ${DATA.users.map(u => `<option value="${u.id}" ${udharBuilder.user_id === u.id ? 'selected' : ''}>${u.name} (${u.phone})</option>`).join('')}
        </select>

        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button type="button" class="primary" style="flex:1;background:${isUdhar?'#e65100':'#ccc'};color:${isUdhar?'#fff':'#333'};font-size:14px;" onclick="setUdharType('udhar')">
            📕 Udhar (Saman)
          </button>
          <button type="button" class="primary" style="flex:1;background:${!isUdhar?'#2e7d32':'#ccc'};color:${!isUdhar?'#fff':'#333'};font-size:14px;" onclick="setUdharType('jama')">
            💚 Jama (Paisa)
          </button>
        </div>

        ${isUdhar ? `
          <!-- SAMAN LIST -->
          <label style="font-size:13px;font-weight:bold;">📋 Saman List</label>
          <div style="background:#f9f9f9;padding:8px;border-radius:8px;margin:6px 0 12px;min-height:40px;">
            ${udharBuilder.items.length === 0 
              ? '<div style="text-align:center;color:#888;font-size:13px;padding:12px;">Neeche se saman add karo 👇</div>'
              : udharBuilder.items.map((it, idx) => `
                <div class="udhar-item">
                  <div class="info">
                    <div style="font-weight:600;">${it.name}</div>
                    <div style="font-size:11px;color:#666;">${it.qty} ${it.unit} × ₹${it.price}</div>
                  </div>
                  <div class="amount">₹${it.amount.toFixed(2)}</div>
                  <button class="primary small danger" style="width:auto;padding:6px 8px;font-size:12px;" onclick="removeUdharItem(${idx})">✕</button>
                </div>
              `).join('')}
          </div>

          <!-- ADD ITEM -->
          <div style="background:#e3f2fd;padding:10px;border-radius:8px;margin-bottom:12px;">
            <label style="font-size:12px;color:#1976d2;font-weight:bold;">➕ Saman Add Karo</label>
            <select id="itemProductSel" onchange="onItemProductChange()" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin:6px 0;font-size:14px;">
              <option value="">-- Product --</option>
              ${DATA.products.filter(p => !p.hidden).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
            </select>

            <div id="itemQtySection" style="display:none;">
              <div style="font-size:12px;color:#666;margin-bottom:4px;">Quantity:</div>
              <div id="itemQtyButtons" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:6px;margin-bottom:8px;"></div>
              <div style="display:flex;gap:6px;align-items:center;margin-bottom:8px;">
                <input type="number" id="itemCustomQty" placeholder="Custom qty" step="0.25" min="0.25" onchange="updateItemPreview()" style="flex:1;padding:8px;border:1px solid #ccc;border-radius:6px;">
                <span id="itemUnitLabel" style="font-weight:bold;"></span>
              </div>
              <div style="text-align:right;font-size:13px;margin-bottom:6px;">
                Subtotal: <b id="itemSubtotalPreview" style="color:#2e7d32;font-size:16px;">₹0</b>
              </div>
              <button type="button" class="primary" style="background:#1976d2;font-size:14px;" onclick="addItemToUdhar()">
                ➕ Add to List
              </button>
            </div>
          </div>
        ` : `
          <!-- JAMA AMOUNT -->
          <label style="font-size:13px;font-weight:bold;">💵 Amount ₹</label>
          <input type="number" id="jamaAmountInput" placeholder="Paisa kitna diya" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin:6px 0 12px;font-size:15px;" onchange="updateJamaPreview()">
        `}

        <label style="font-size:13px;font-weight:bold;">📝 Note (optional)</label>
        <input id="udNoteInput" placeholder="Jaise: Ghar le gaya" value="${udharBuilder.note}" onchange="udharBuilder.note = this.value;" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin:6px 0 12px;">

        <div style="background:${isUdhar?'#fff3e0':'#e8f5e9'};padding:12px;border-radius:8px;margin-bottom:12px;text-align:center;">
          <div style="font-size:13px;color:#666;">Total ${isUdhar?'Udhar':'Jama'}</div>
          <div id="udTotalPreview" style="font-size:26px;font-weight:bold;color:${isUdhar?'#e65100':'#2e7d32'};">
            ₹${total.toFixed(2)}
          </div>
        </div>

        <div style="display:flex;gap:8px;">
          <button class="primary" style="background:#777;" onclick="closeUdharModal()">Cancel</button>
          <button class="primary" style="background:#2e7d32;" onclick="saveUdharEntry()">💾 Save</button>
        </div>
      </div>
    </div>`;
}

function setUdharType(t) {
  udharBuilder.type = t;
  renderUdharBuilder();
}

function onItemProductChange() {
  const pid = document.getElementById('itemProductSel').value;
  const p = DATA.products.find(x => x.id === pid);
  const section = document.getElementById('itemQtySection');
  const btns = document.getElementById('itemQtyButtons');
  const unitLabel = document.getElementById('itemUnitLabel');
  
  if (!p) { section.style.display = 'none'; return; }
  
  section.style.display = 'block';
  unitLabel.textContent = p.unit;
  document.getElementById('itemCustomQty').value = '';
  document.getElementById('itemSubtotalPreview').textContent = '₹0';

  // Quick quantity buttons based on type
  if (p.type === 'loose') {
    // Loose — 250gm, 500gm, 1kg, 2kg, 5kg
    let opts = [];
    if (p.unit === 'kg') opts = [0.25, 0.5, 1, 2, 5, 10];
    else if (p.unit === 'gram') opts = [50, 100, 250, 500, 1000];
    else if (p.unit === 'liter') opts = [0.25, 0.5, 1, 2, 5];
    else if (p.unit === 'ml') opts = [100, 250, 500, 1000];
    
    btns.innerHTML = opts.map(q => {
      const disp = q >= 1 ? q : Math.round(q * 1000);
      const dispU = q >= 1 ? p.unit : (p.unit === 'kg' ? 'gm' : p.unit === 'liter' ? 'ml' : p.unit);
      return `<button type="button" onclick="setItemQty(${q})" style="padding:10px 4px;border:2px solid #ddd;border-radius:8px;background:#fff;font-weight:bold;font-size:13px;cursor:pointer;">
        ${disp}${dispU}
      </button>`;
    }).join('');
  } else {
    // Packet — 1, 2, 3, 4, 5, 10
    btns.innerHTML = [1, 2, 3, 4, 5, 10].map(n => `
      <button type="button" onclick="setItemQty(${n})" style="padding:10px 4px;border:2px solid #ddd;border-radius:8px;background:#fff;font-weight:bold;font-size:13px;cursor:pointer;">
        ${n} ${p.unit}
      </button>
    `).join('');
  }
}

let _tempQty = 1;
function setItemQty(q) {
  _tempQty = q;
  document.getElementById('itemCustomQty').value = q;
  updateItemPreview();
}

function updateItemPreview() {
  const pid = document.getElementById('itemProductSel').value;
  const p = DATA.products.find(x => x.id === pid);
  if (!p) return;
  const q = parseFloat(document.getElementById('itemCustomQty').value) || 0;
  const sub = (p.retail || 0) * q;
  document.getElementById('itemSubtotalPreview').textContent = '₹' + sub.toFixed(2);
}

function addItemToUdhar() {
  const pid = document.getElementById('itemProductSel').value;
  const p = DATA.products.find(x => x.id === pid);
  if (!p) return toast('Product select karo');

  const q = parseFloat(document.getElementById('itemCustomQty').value) || 0;
  if (q <= 0) return toast('Quantity daalo');

  const amount = (p.retail || 0) * q;
  udharBuilder.items.push({
    product_id: pid,
    name: p.name,
    unit: p.unit,
    qty: q,
    price: p.retail,
    amount: amount
  });

  document.getElementById('itemProductSel').value = '';
  document.getElementById('itemQtySection').style.display = 'none';
  document.getElementById('itemCustomQty').value = '';
  document.getElementById('itemSubtotalPreview').textContent = '₹0';

  renderUdharBuilder();
}

function removeUdharItem(idx) {
  udharBuilder.items.splice(idx, 1);
  renderUdharBuilder();
}

function updateJamaPreview() {
  const amt = parseFloat(document.getElementById('jamaAmountInput').value) || 0;
  document.getElementById('udTotalPreview').textContent = '₹' + amt.toFixed(2);
}

function closeUdharModal() {
  document.getElementById('udharModalRoot').innerHTML = '';
  udharBuilder = { user_id: '', type: 'udhar', items: [], note: '' };
}

async function saveUdharEntry() {
  const user_id = document.getElementById('udUserSel').value;
  if (!user_id) return toast('Customer select karo');

  const note = document.getElementById('udNoteInput').value.trim();
  let total = 0;
  let items = [];

  if (udharBuilder.type === 'udhar') {
    items = udharBuilder.items;
    total = items.reduce((s, it) => s + (+it.amount || 0), 0);
    if (total <= 0) return toast('Kuch saman add karo');
  } else {
    total = parseFloat(document.getElementById('jamaAmountInput').value) || 0;
    if (total <= 0) return toast('Amount daalo');
  }

  const u = DATA.users.find(x => x.id === user_id);
  const now = new Date();

  const rec = {
    id: uid(),
    user_id,
    user_name: u.name,
    user_phone: u.phone,
    type: udharBuilder.type,
    items: items,
    amount: total,
    note: note || (udharBuilder.type === 'jama' ? 'Payment jama' : 'Udhar'),
    status: udharBuilder.type === 'jama' ? 'paid' : 'pending',
    created_at: now.toISOString(),
    date_str: now.toISOString().split('T')[0],
    time_str: now.toTimeString().slice(0,5)
  };

  try {
    await fbSaveUdhar(rec);
    DATA = await loadData();
    toast(udharBuilder.type === 'jama' ? '✅ Jama' : '✅ Udhar');
    closeUdharModal();
    renderUdhar();
  } catch (e) { toast('❌ ' + e.message); }
}

function renderUdhar() {
  const list = document.getElementById('udharCustomerList');
  const q = (document.getElementById('udCustomerSearch').value || '').toLowerCase();

  const byCustomer = {};
  DATA.udhar.forEach(u => {
    if (!byCustomer[u.user_id]) {
      byCustomer[u.user_id] = {
        user_id: u.user_id, user_name: u.user_name, user_phone: u.user_phone,
        entries: [], total_udhar: 0, total_jama: 0
      };
    }
    byCustomer[u.user_id].entries.push(u);
    const isJama = u.type === 'jama' || u.status === 'paid';
    if (isJama) byCustomer[u.user_id].total_jama += +u.amount || 0;
    else byCustomer[u.user_id].total_udhar += +u.amount || 0;
  });

  const customerList = Object.values(byCustomer).map(c => {
    c.balance = c.total_udhar - c.total_jama;
    return c;
  }).filter(c => !q || (c.user_name||'').toLowerCase().includes(q) || (c.user_phone||'').includes(q));

  customerList.sort((a, b) => b.balance - a.balance);

  if (!customerList.length) {
    list.innerHTML = '<div class="center" style="padding:20px;color:#888;">Koi udhar nahi. ➕ Naya Udhar dabao.</div>';
  } else {
    list.innerHTML = customerList.map(c => {
      const isAdvance = c.balance < 0;
      const isClear = c.balance === 0;
      const color = isAdvance ? '#2e7d32' : (isClear ? '#666' : '#c62828');
      const text = isAdvance 
        ? `💚 ₹${Math.abs(c.balance).toFixed(2)} Advance` 
        : (isClear ? '✅ Clear' : `📕 ₹${c.balance.toFixed(2)} Baaki`);

      return `
        <div style="padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;" onclick="openCustomerLedger('${c.user_id}')">
          <div style="display:flex;justify-content:space-between;">
            <div style="flex:1;">
              <div style="font-weight:bold;">${c.user_name}</div>
              <div style="font-size:12px;color:#666;">📞 ${c.user_phone}</div>
              <div style="font-size:11px;color:#999;">📕 ₹${c.total_udhar.toFixed(0)} • 💚 ₹${c.total_jama.toFixed(0)}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:bold;color:${color};font-size:15px;">${text}</div>
              <div style="font-size:11px;color:#888;">${c.entries.length} entries ›</div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  const totals = Object.values(byCustomer).reduce((acc, c) => {
    const bal = c.total_udhar - c.total_jama;
    if (bal > 0) acc.pending += bal;
    else acc.advance += Math.abs(bal);
    return acc;
  }, { pending: 0, advance: 0 });

  document.getElementById('udTotalPending').textContent = '₹' + totals.pending.toFixed(0);
  document.getElementById('udTotalAdvance').textContent = '₹' + totals.advance.toFixed(0);
  document.getElementById('udTotalCustomers').textContent = Object.keys(byCustomer).length;
}
document.getElementById('udCustomerSearch').oninput = renderUdhar;

function openCustomerLedger(userId) {
  const u = DATA.users.find(x => x.id === userId);
  if (!u) return;

  const entries = DATA.udhar.filter(x => x.user_id === userId)
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  let running = 0;
  const ledger = entries.map(e => {
    const isJama = e.type === 'jama' || e.status === 'paid';
    if (isJama) running -= +e.amount;
    else running += +e.amount;
    return { ...e, running, isJama };
  });
  ledger.reverse();

  const totalUdhar = entries.filter(e => !(e.type === 'jama' || e.status === 'paid')).reduce((a, e) => a + +e.amount, 0);
  const totalJama = entries.filter(e => e.type === 'jama' || e.status === 'paid').reduce((a, e) => a + +e.amount, 0);
  const finalBalance = totalUdhar - totalJama;

  document.getElementById('udharModalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeUdharModal()">
      <div class="modal-box">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
          <div>
            <h3 style="margin:0;">📔 ${u.name}</h3>
            <div style="font-size:12px;color:#666;">📞 ${u.phone}</div>
          </div>
          <button class="primary small" style="width:auto;background:#777;" onclick="closeUdharModal()">✕</button>
        </div>

        <div style="background:${finalBalance>0?'#ffebee':finalBalance<0?'#e8f5e9':'#f5f5f5'};padding:12px;border-radius:8px;margin-bottom:12px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;"><span>📕 Udhar:</span><b>₹${totalUdhar.toFixed(2)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:#666;margin-top:4px;"><span>💚 Jama:</span><b>₹${totalJama.toFixed(2)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:bold;color:${finalBalance>0?'#c62828':finalBalance<0?'#2e7d32':'#333'};margin-top:8px;padding-top:8px;border-top:1px solid #ddd;">
            <span>${finalBalance>0?'📕 Baaki:':finalBalance<0?'💚 Advance:':'✅ Clear:'}</span>
            <b>₹${Math.abs(finalBalance).toFixed(2)}</b>
          </div>
        </div>

        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <button class="primary small" style="background:#e65100;" onclick="openNewUdhar('${userId}')">📕 Udhar</button>
          <button class="primary small" style="background:#2e7d32;" onclick="openNewJama('${userId}')">💚 Jama</button>
        </div>

        <div style="font-size:13px;font-weight:bold;margin-bottom:8px;">📋 Poora Hisaab</div>
        <div style="background:#f9f9f9;border-radius:8px;padding:4px;">
          ${ledger.length === 0 ? '<div style="padding:20px;text-align:center;color:#888;">Koi entry nahi</div>' : ledger.map(e => {
            const d = new Date(e.created_at);
            const dateStr = d.toLocaleDateString('hi-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = d.toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
            const itemsList = (e.items && e.items.length)
              ? e.items.map(it => `<div style="font-size:12px;color:#555;padding-left:12px;">• ${it.name || it.product_name} — ${it.qty} ${it.unit} × ₹${it.price} = ₹${(+it.amount).toFixed(2)}</div>`).join('')
              : '';
            return `
              <div style="background:#fff;border-radius:6px;padding:10px;margin-bottom:6px;border-left:4px solid ${e.isJama?'#2e7d32':'#e65100'};">
                <div style="display:flex;justify-content:space-between;">
                  <div style="flex:1;">
                    <div style="font-size:11px;color:#888;">📅 ${dateStr} • ⏰ ${timeStr}</div>
                    <div style="font-size:13px;font-weight:600;">${e.isJama?'💚':'📕'} ${e.note}</div>
                    ${itemsList}
                  </div>
                  <div style="text-align:right;">
                    <div style="font-size:15px;font-weight:bold;color:${e.isJama?'#2e7d32':'#c62828'};">
                      ${e.isJama?'−':'+'} ₹${(+e.amount).toFixed(2)}
                    </div>
                    <div style="font-size:11px;color:#666;">Bal: ₹${(+e.running).toFixed(2)}</div>
                  </div>
                </div>
                <div style="margin-top:6px;display:flex;gap:6px;">
                  <button class="primary small" style="background:#1976d2;font-size:11px;width:auto;padding:4px 8px;" onclick="editUdharEntry('${e.id}', '${userId}')">✏️</button>
                  <button class="primary small danger" style="font-size:11px;width:auto;padding:4px 8px;" onclick="deleteUdharEntry('${e.id}', '${userId}')">🗑️</button>
                </div>
              </div>`;
          }).join('')}
        </div>

        <button class="primary" style="background:#777;margin-top:12px;" onclick="closeUdharModal()">Close</button>
      </div>
    </div>`;
}

function openNewJama(customerId) {
  openNewUdhar(customerId);
  setTimeout(() => setUdharType('jama'), 100);
}

async function editUdharEntry(id, userId) {
  const e = DATA.udhar.find(x => x.id === id);
  if (!e) return;
  const newAmt = prompt('Amount:', e.amount);
  if (newAmt === null) return;
  const newNote = prompt('Note:', e.note);
  if (newNote === null) return;
  const amt = parseFloat(newAmt);
  if (!amt || amt <= 0) return toast('Invalid');
  try {
    await FB.collection('udhar').doc(id).set({ amount: amt, note: newNote, updated_at: new Date().toISOString() }, { merge: true });
    DATA = await loadData();
    toast('✅ Update');
    closeUdharModal();
    setTimeout(() => openCustomerLedger(userId), 200);
    renderUdhar();
  } catch (err) { toast('❌ ' + err.message); }
}

async function deleteUdharEntry(id, userId) {
  if (!confirm('Delete?')) return;
  try {
    await FB.collection('udhar').doc(id).delete();
    DATA = await loadData();
    toast('🗑️');
    closeUdharModal();
    renderUdhar();
  } catch (err) { toast('❌ ' + err.message); }
}

/* ========== CAMERA ========== */
let cameraStream = null, currentFacingMode = 'environment';
async function openLiveCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    document.getElementById('pImgGallery').click(); return;
  }
  try {
    if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacingMode }, audio: false
    });
    document.getElementById('cameraModal').style.display = 'flex';
    document.getElementById('cameraVideo').srcObject = cameraStream;
    await document.getElementById('cameraVideo').play();
  } catch (err) { toast('❌ ' + err.name); }
}
function closeCamera() {
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  document.getElementById('cameraModal').style.display = 'none';
  document.getElementById('cameraVideo').srcObject = null;
}
function capturePhoto() {
  const v = document.getElementById('cameraVideo');
  const c = document.getElementById('cameraCanvas');
  if (!v.videoWidth) return;
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  c.toBlob(b => {
    closeCamera();
    processImage(new File([b], 'cam-' + Date.now() + '.jpg', { type: 'image/jpeg' }));
  }, 'image/jpeg', 0.9);
}
async function switchCamera() {
  currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
  closeCamera(); openLiveCamera();
}
function handleImageSelect(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  processImage(f);
  setTimeout(() => { try { e.target.value = ''; } catch(x){} }, 500);
}
async function processImage(file) {
  const status = document.getElementById('imgStatus');
  const prev = document.getElementById('pPreview');
  if (file.size > 10*1024*1024) return toast('❌ 10MB');
  status.textContent = '⏳ Compress...';
  const compressed = await compressImage(file, 1000, 1000, 0.75);
  compressedImageFile = compressed;
  prev.src = URL.createObjectURL(compressed);
  prev.style.display = 'block';
  status.textContent = '✅ Ready';
}
function compressImage(file, maxW, maxH, quality) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        c.toBlob(b => {
          if (!b) return resolve(file);
          resolve(new File([b], (file.name||'photo').replace(/\.[^.]+$/, '')+'.jpg', { type: 'image/jpeg' }));
        }, 'image/jpeg', quality);
      };
      img.onerror = () => resolve(file);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(file);
    reader.readAsDataURL(file);
  });
}
