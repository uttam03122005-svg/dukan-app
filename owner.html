<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Panel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>👨‍💼 Owner Panel</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <div class="card" style="display:flex;padding:0;overflow:auto;">
      <button class="primary tabBtn" data-tab="products" style="border-radius:0;">Products</button>
      <button class="primary tabBtn" data-tab="users" style="border-radius:0;background:#ccc;color:#333;">Customers</button>
      <button class="primary tabBtn" data-tab="orders" style="border-radius:0;background:#ccc;color:#333;">Orders</button>
    </div>

    <!-- PRODUCTS -->
    <div id="tab-products">
      <div class="card">
        <h3 id="pFormTitle">➕ Naya Product</h3>
        <input type="hidden" id="pId">
        <input id="pName" placeholder="Product name (jaise Aata, Gold Flake)">
        <input id="pImg" type="file" accept="image/*">
        <img id="pPreview" style="max-width:100%;margin-top:6px;border-radius:6px;display:none;">

        <label style="font-size:13px;color:#666;margin-top:8px;display:block;">Kaise bechte ho? (Unit)</label>
        <select id="pUnit">
          <option value="kg">⚖️ KG (किलो — tolne wala)</option>
          <option value="gram">⚖️ Gram (ग्राम)</option>
          <option value="liter">🥤 Liter (लीटर — naapne wala)</option>
          <option value="ml">🥤 ML</option>
          <option value="piece">📦 Piece (नग — ginti wala)</option>
          <option value="packet">🛍️ Packet (पैकेट)</option>
          <option value="box">📦 Box / Dibba (डिब्बा)</option>
          <option value="dozen">🔢 Dozen (दर्जन)</option>
          <option value="strip">💊 Strip</option>
          <option value="bottle">🍾 Bottle</option>
        </select>

        <label style="font-size:13px;color:#666;margin-top:6px;display:block;">Price per unit</label>
        <div class="row">
          <input id="pRetail" placeholder="Retail ₹" inputmode="decimal">
          <input id="pWhole" placeholder="Wholesale ₹" inputmode="decimal">
        </div>

        <label style="font-size:13px;color:#666;margin-top:6px;display:block;">Stock aur Category</label>
        <div class="row">
          <input id="pStock" placeholder="Stock qty" inputmode="decimal">
          <input id="pCat" placeholder="Category">
        </div>

        <button class="primary" onclick="saveProduct()">💾 Save Product</button>
        <button class="primary" style="background:#777;" onclick="resetProductForm()">Reset</button>
      </div>

      <input class="search-bar" id="pSearch" placeholder="🔍 Product search...">
      <div id="productList"></div>
    </div>

    <!-- USERS -->
    <div id="tab-users" class="hidden">
      <input class="search-bar" id="uSearch" placeholder="🔍 Customer search (naam / phone)">
      <div id="userList"></div>
    </div>

    <!-- ORDERS -->
    <div id="tab-orders" class="hidden">
      <div id="orderList"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const s = getSession();
    if (!s || s.role !== 'owner') location.href = 'index.html';

    let DATA = null;       // owner data.json
    let CUST = null;       // customers.json (public)
    let editingImageUrl = '';

    const UNIT_LABEL = {
      kg:'kg', gram:'g', liter:'L', ml:'ml', piece:'pc',
      packet:'pkt', box:'box', dozen:'doz', strip:'strip', bottle:'bottle'
    };

    async function init() {
      DATA = await loadData();          // owner ke products, orders, aur "upgraded users"
      CUST = await loadCustomers();     // sab registered customers

      // Merge: data.json me jo user upgrade hue hai (wholesale/special) unka info
      // aur customers.json me jo sab register hue hai — dono mila ke dikhao
      DATA.users = CUST.users.map(cu => {
        const ou = DATA.users.find(u => u.id === cu.id || (u.phone === cu.phone));
        return {
          id: cu.id,
          name: cu.name,
          phone: cu.phone,
          price_type: ou?.price_type || 'retail',
          special_prices: ou?.special_prices || {},
          created_at: cu.created_at
        };
      });

      renderProducts();
      renderUsers();
      renderOrders();
    }

    document.querySelectorAll('.tabBtn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tabBtn').forEach(b => {
          b.style.background = '#ccc'; b.style.color = '#333';
        });
        btn.style.background = '#2e7d32'; btn.style.color = '#fff';
        ['products','users','orders'].forEach(t => {
          document.getElementById('tab-'+t).classList.toggle('hidden', t !== btn.dataset.tab);
        });
      };
    });

    /* PRODUCTS */
    document.getElementById('pImg').onchange = e => {
      const f = e.target.files[0];
      if (f) {
        const prev = document.getElementById('pPreview');
        prev.src = URL.createObjectURL(f);
        prev.style.display = 'block';
      }
    };

    function resetProductForm() {
      ['pId','pName','pRetail','pWhole','pStock','pCat'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('pUnit').value = 'kg';
      document.getElementById('pImg').value = '';
      document.getElementById('pPreview').style.display = 'none';
      editingImageUrl = '';
      document.getElementById('pFormTitle').textContent = '➕ Naya Product';
    }

    async function saveProduct() {
      const name = document.getElementById('pName').value.trim();
      const unit = document.getElementById('pUnit').value;
      const retail = +document.getElementById('pRetail').value;
      const whole = +document.getElementById('pWhole').value;
      const stock = +document.getElementById('pStock').value;
      const cat = document.getElementById('pCat').value.trim();
      const file = document.getElementById('pImg').files[0];
      const editId = document.getElementById('pId').value;

      if (!name || !retail) return toast('Naam aur retail price zaroori');

      try {
        toast('Save ho raha hai...');
        let imageUrl = editingImageUrl;
        if (file) imageUrl = await uploadImage(file);

        if (editId) {
          const p = DATA.products.find(x => x.id === editId);
          Object.assign(p, {
            name, unit, retail_price: retail, wholesale_price: whole || retail,
            stock: stock || 0, category: cat, image: imageUrl
          });
        } else {
          DATA.products.push({
            id: uid(), name, unit, image: imageUrl,
            retail_price: retail, wholesale_price: whole || retail,
            stock: stock || 0, category: cat, hidden: false,
            created_at: new Date().toISOString()
          });
        }

        await saveData(DATA);
        toast('✅ Save ho gaya!');
        resetProductForm();
        renderProducts();
      } catch (e) { toast('❌ ' + e.message); }
    }

    function editProduct(id) {
      const p = DATA.products.find(x => x.id === id);
      if (!p) return;
      document.getElementById('pId').value = p.id;
      document.getElementById('pName').value = p.name;
      document.getElementById('pUnit').value = p.unit || 'kg';
      document.getElementById('pRetail').value = p.retail_price;
      document.getElementById('pWhole').value = p.wholesale_price;
      document.getElementById('pStock').value = p.stock;
      document.getElementById('pCat').value = p.category || '';
      editingImageUrl = p.image || '';
      const prev = document.getElementById('pPreview');
      if (p.image) { prev.src = p.image; prev.style.display = 'block'; }
      document.getElementById('pFormTitle').textContent = '✏️ Edit Product';
      window.scrollTo(0, 0);
    }

    async function deleteProduct(id) {
      if (!confirm('Delete karna hai?')) return;
      DATA.products = DATA.products.filter(p => p.id !== id);
      try { await saveData(DATA); toast('🗑️ Delete'); renderProducts(); }
      catch (e) { toast('❌ ' + e.message); }
    }

    async function toggleHide(id) {
      const p = DATA.products.find(x => x.id === id);
      p.hidden = !p.hidden;
      try { await saveData(DATA); renderProducts(); }
      catch (e) { toast('❌ ' + e.message); }
    }

    function renderProducts() {
      const q = (document.getElementById('pSearch').value || '').toLowerCase();
      const list = document.getElementById('productList');
      const items = DATA.products.filter(p => p.name.toLowerCase().includes(q));
      if (!items.length) { list.innerHTML = '<div class="card center">Koi product nahi</div>'; return; }
      list.innerHTML = items.map(p => {
        const u = UNIT_LABEL[p.unit] || 'kg';
        return `
        <div class="card">
          <div class="row">
            <img src="${p.image || 'https://via.placeholder.com/80'}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;flex:0 0 80px;">
            <div style="flex:1;">
              <div style="font-weight:600;">${p.name} ${p.hidden ? '<span style="color:#c62828;font-size:12px;">(Hidden)</span>' : ''}</div>
              <div style="color:#2e7d32;font-weight:bold;">${inr(p.retail_price)}/${u} <span style="color:#777;font-weight:normal;font-size:12px;">| Whole ${inr(p.wholesale_price)}/${u}</span></div>
              <div style="font-size:12px;color:#777;">Stock: ${p.stock} ${u} | ${p.category || '-'}</div>
            </div>
          </div>
          <div class="row mt">
            <button class="primary small" onclick="editProduct('${p.id}')">✏️ Edit</button>
            <button class="primary small" style="background:#f57c00;" onclick="toggleHide('${p.id}')">${p.hidden ? '👁️ Show' : '🙈 Hide'}</button>
            <button class="primary small danger" onclick="deleteProduct('${p.id}')">🗑️ Delete</button>
          </div>
        </div>`;
      }).join('');
    }
    document.getElementById('pSearch').oninput = renderProducts;

    /* USERS */
    async function toggleWholesale(id) {
      const u = DATA.users.find(x => x.id === id);
      const newType = u.price_type === 'wholesale' ? 'retail' : 'wholesale';
      if (!confirm(`${u.name} ko ${newType.toUpperCase()} kar dein?`)) return;

      u.price_type = newType;
      // data.json me ye user save karo (customers.json me nahi, kyunki wahan sirf register hai)
      const ownerUser = DATA.users.find(x => x.id === id) || {};
      // DATA.users me already update ho gaya, ab data.json me save karo
      // Lekin dhyan: DATA.users me customers.json wale users bhi hain. Sirf owner wale save karo.
      // Solution: ek alag ownerUsers list rakho
      await saveOwnerUser(u);
      renderUsers();
    }

    async function saveOwnerUser(user) {
      // data.json me sirf owner-managed users rakho
      const ownerData = await loadData();
      let existing = ownerData.users.find(x => x.id === user.id || x.phone === user.phone);
      if (existing) {
        existing.price_type = user.price_type;
        existing.special_prices = user.special_prices;
      } else {
        ownerData.users.push({
          id: user.id,
          name: user.name,
          phone: user.phone,
          price_type: user.price_type,
          special_prices: user.special_prices || {},
          created_at: user.created_at || new Date().toISOString()
        });
      }
      try {
        await saveData(ownerData);
        toast(user.price_type === 'wholesale' ? '💼 Wholesale ho gaya' : '🛒 Retail kar diya');
      } catch (e) { toast('❌ ' + e.message); }
    }

    function renderUsers() {
      const q = (document.getElementById('uSearch').value || '').toLowerCase();
      const list = document.getElementById('userList');
      const items = DATA.users.filter(u =>
        u.name.toLowerCase().includes(q) || u.phone.includes(q)
      );
      if (!items.length) {
        list.innerHTML = '<div class="card center">Koi customer nahi. Customer jab pehli baar login karega, yahan aa jayega.</div>';
        return;
      }
      list.innerHTML = items.map(u => {
        const isWhole = u.price_type === 'wholesale';
        const specials = Object.keys(u.special_prices || {}).map(pid => {
          const p = DATA.products.find(x => x.id === pid);
          return p ? `${p.name}: ${inr(u.special_prices[pid])}` : '';
        }).filter(Boolean).join(', ');
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;">
              <b>${u.name}</b>
              <span style="font-size:12px;padding:2px 8px;border-radius:10px;background:${isWhole?'#fff3e0':'#e8f5e9'};color:${isWhole?'#e65100':'#2e7d32'};">
                ${isWhole ? '💼 Wholesale' : '🛒 Retail'}
              </span>
            </div>
            <div style="font-size:13px;color:#666;">📞 ${u.phone}</div>
            ${specials ? `<div style="font-size:12px;color:#f57c00;margin-top:4px;">⭐ Special: ${specials}</div>` : ''}
            <div class="row mt">
              <button class="primary small" style="background:${isWhole?'#2e7d32':'#f57c00'};" onclick="toggleWholesale('${u.id}')">
                ${isWhole ? '🛒 Retail Karo' : '💼 Wholesale Karo'}
              </button>
            </div>
          </div>
        `;
      }).join('');
    }
    document.getElementById('uSearch').oninput = renderUsers;

    /* ORDERS */
    async function updateOrder(orderId, patch) {
      const o = DATA.orders.find(x => x.id === orderId);
      Object.assign(o, patch);
      try { await saveData(DATA); renderOrders(); }
      catch (e) { toast('❌ ' + e.message); }
    }

    function renderOrders() {
      const list = document.getElementById('orderList');
      if (!DATA.orders.length) { list.innerHTML = '<div class="card center">Koi order nahi</div>'; return; }
      list.innerHTML = DATA.orders.slice().reverse().map(o => {
        const u = DATA.users.find(x => x.id === o.user_id) || { name: 'Unknown', phone: '' };
        const items = o.items.map(it => {
          const p = DATA.products.find(x => x.id === it.product_id) || { name: '?' };
          const unit = UNIT_LABEL[p.unit] || it.unit || '';
          return `<div style="font-size:13px;">• ${p.name} — ${it.qty} ${unit} × ${inr(it.price)} = ${inr(it.price * it.qty)}</div>`;
        }).join('');
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;">
              <b>${u.name} <span style="font-size:11px;color:#666;">📞 ${u.phone || ''}</span></b>
              <span style="font-size:12px;color:#666;">${new Date(o.created_at).toLocaleString('hi-IN')}</span>
            </div>
            <div class="mt">${items}</div>
            <div style="font-weight:bold;color:#2e7d32;margin-top:6px;">Total: ${inr(o.total)}</div>
            <div style="font-size:13px;margin-top:4px;">Status: <b>${o.status}</b> | Payment: <b>${o.payment}</b></div>
            <div class="row mt">
              <button class="primary small" onclick="updateOrder('${o.id}',{status:'packed'})">📦 Packed</button>
              <button class="primary small" onclick="updateOrder('${o.id}',{status:'delivered'})">✅ Delivered</button>
              <button class="primary small" style="background:#f57c00;" onclick="updateOrder('${o.id}',{payment:'paid'})">💰 Paid</button>
            </div>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
