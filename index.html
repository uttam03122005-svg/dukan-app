<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dukan App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header"><h1>🏪 Dukan App</h1></div>

  <div class="container">
    <div class="card center">
      <h2 style="color:#2e7d32;">Welcome!</h2>
      <p style="color:#666;font-size:14px;">Login karo</p>
    </div>

    <div class="card" style="display:flex;padding:0;">
      <button id="tabUser" class="primary" style="border-radius:0;background:#2e7d32;">Customer</button>
      <button id="tabOwner" class="primary" style="border-radius:0;background:#ccc;color:#333;">Owner</button>
    </div>

    <!-- USER: sirf phone -->
    <div id="userForm" class="card">
      <h3>Customer Login</h3>
      <input id="uPhone" placeholder="Phone number (10 digit)" inputmode="numeric" maxlength="10">
      <button class="primary" onclick="userLogin()">Login</button>
    </div>

    <!-- OWNER -->
    <div id="ownerForm" class="card hidden">
      <h3>Owner Login</h3>
      <input id="oId" placeholder="Owner ID">
      <input id="oPass" type="password" placeholder="Password">

      <!-- Extra fields — pehli baar hi dikhenge -->
      <div id="ownerExtra">
        <input id="oToken" placeholder="GitHub Token">
        <input id="oImgbb" placeholder="ImgBB Key">
        <input id="oUpi" placeholder="UPI ID (jaise 9876543210@paytm)">
        <input id="oUpiName" placeholder="UPI Name (dukan ka naam)">
        <p style="font-size:12px;color:#888;margin-top:4px;">
          Ye sab sirf pehli baar. Agli baar sirf ID + Password.
        </p>
      </div>

      <div id="ownerSetupDone" class="hidden" style="font-size:12px;color:#2e7d32;margin-top:4px;">
        ✅ Setup already done — sirf ID + Password daalo
      </div>

      <button class="primary" onclick="ownerLogin()">Login</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // 🔒 Session check
    (function() {
      const s = getSession();
      if (s && s.role === 'owner') { location.replace('owner.html'); return; }
      if (s && s.role === 'user')  { location.replace('user.html');  return; }
    })();

    const tabU = document.getElementById('tabUser');
    const tabO = document.getElementById('tabOwner');
    tabU.onclick = () => {
      tabU.style.background = '#2e7d32'; tabU.style.color = '#fff';
      tabO.style.background = '#ccc'; tabO.style.color = '#333';
      document.getElementById('userForm').classList.remove('hidden');
      document.getElementById('ownerForm').classList.add('hidden');
    };
    tabO.onclick = () => {
      tabO.style.background = '#2e7d32'; tabO.style.color = '#fff';
      tabU.style.background = '#ccc'; tabU.style.color = '#333';
      document.getElementById('ownerForm').classList.remove('hidden');
      document.getElementById('userForm').classList.add('hidden');
      checkOwnerSetup();
    };

    // owner setup check — data.json me settings.gh_token hai to extra fields hide
    async function checkOwnerSetup() {
      try {
        const d = await loadData();
        if (d.settings?.gh_token) {
          document.getElementById('ownerExtra').classList.add('hidden');
          document.getElementById('ownerSetupDone').classList.remove('hidden');
        } else {
          document.getElementById('ownerExtra').classList.remove('hidden');
          document.getElementById('ownerSetupDone').classList.add('hidden');
        }
      } catch (e) { /* ignore */ }
    }

    /* ---------- CUSTOMER LOGIN (sirf phone) ---------- */
    async function userLogin() {
      const phone = document.getElementById('uPhone').value.trim();
      if (phone.length !== 10) return toast('10 digit phone daalo');

      toast('Login ho raha hai...');

      const cData = await loadCustomers();
      const local = JSON.parse(localStorage.getItem('my_users') || '[]');

      let user = cData.users.find(u => u.phone === phone);
      if (!user) user = local.find(u => u.phone === phone);

      if (!user) {
        user = {
          id: 'U' + phone,
          name: 'Customer',
          phone: phone,
          created_at: new Date().toISOString()
        };
        const l2 = JSON.parse(localStorage.getItem('my_users') || '[]');
        if (!l2.find(u => u.phone === phone)) {
          l2.push(user);
          localStorage.setItem('my_users', JSON.stringify(l2));
        }
        try {
          cData.users.push(user);
          await saveCustomers(cData);
          toast('✅ Register ho gaya');
        } catch (e) {
          console.warn('Save fail:', e);
          toast('✅ Login ho gaya');
        }
      } else {
        toast('Wapas swagat!');
      }

      const oData = await loadData();
      const ownerUser = oData.users.find(u => u.phone === phone);
      saveSession('user', {
        id: user.id,
        name: ownerUser?.name || user.name || 'Customer',
        phone: phone,
        price_type: ownerUser?.price_type || 'retail',
        special_prices: ownerUser?.special_prices || {}
      });

      setTimeout(() => location.replace('user.html'), 300);
    }

    /* ---------- OWNER LOGIN ---------- */
    async function ownerLogin() {
      const id = document.getElementById('oId').value.trim();
      const pass = document.getElementById('oPass').value.trim();
      if (!id || !pass) return toast('ID aur password daalo');

      const data = await loadData();
      if (id !== data.owner.id || pass !== data.owner.password) {
        return toast('Galat ID ya password');
      }

      // Agar setup pehle se hai — sirf login
      const hasSetup = data.settings?.gh_token;

      if (!hasSetup) {
        // Pehli baar — extra fields zaroori
        const token = document.getElementById('oToken').value.trim();
        const imgbb = document.getElementById('oImgbb').value.trim();
        const upi = document.getElementById('oUpi').value.trim();
        const upiName = document.getElementById('oUpiName').value.trim();

        if (!token) return toast('GitHub Token daalo');
        if (!imgbb) return toast('ImgBB Key daalo');
        if (!upi) return toast('UPI ID daalo');

        // Save in data.json settings
        data.settings = data.settings || {};
        data.settings.gh_token = token;
        data.settings.imgbb_key = imgbb;
        data.settings.upi_id = upi;
        data.settings.upi_name = upiName || 'Dukan';

        // Save to GitHub using the provided token directly
        try {
          await _githubSave(CONFIG.GITHUB_REPO, CONFIG.GITHUB_FILE, data, token);
        } catch (e) {
          return toast('❌ Setup save fail: ' + e.message);
        }

        // Local me bhi
        localStorage.setItem('gh_token', token);
        localStorage.setItem('imgbb_key', imgbb);
        localStorage.setItem('upi_id', upi);
        localStorage.setItem('upi_name', upiName || 'Dukan');
      } else {
        // Setup already done — data.json se token local me le lo
        localStorage.setItem('gh_token', data.settings.gh_token);
        if (data.settings.imgbb_key) localStorage.setItem('imgbb_key', data.settings.imgbb_key);
        if (data.settings.upi_id) localStorage.setItem('upi_id', data.settings.upi_id);
        if (data.settings.upi_name) localStorage.setItem('upi_name', data.settings.upi_name);
      }

      saveSession('owner', { id });
      toast('Owner login ho gaya');
      setTimeout(() => location.replace('owner.html'), 300);
    }

    // setup check when owner tab opens
    tabO.addEventListener('click', checkOwnerSetup);
  </script>
</body>
</html>
