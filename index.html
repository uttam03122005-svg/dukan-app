<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dukan App</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e7d32">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header"><h1>🏪 Dukan App</h1></div>

  <div class="container">
    <div class="card center">
      <h2 style="color:#2e7d32;">Welcome!</h2>
      <p style="color:#666;font-size:14px;">Login karo</p>
    </div>

    <div class="card" style="display:flex;padding:0;">
      <button id="tabUser" class="primary" style="border-radius:0;background:#2e7d32;">Customer</button>
      <button id="tabOwner" class="primary" style="border-radius:0;background:#ccc;color:#333;">Owner</button>
    </div>

    <div id="userForm" class="card">
      <h3>Customer Login</h3>
      <input id="uPhone" placeholder="Phone number (10 digit)" inputmode="numeric" maxlength="10">
      <button class="primary" onclick="userLogin()">Login</button>
      <p class="center" style="font-size:12px;color:#888;margin-top:8px;">
        Sirf phone number se login
      </p>
    </div>

    <div id="ownerForm" class="card hidden">
      <h3>Owner Login</h3>
      <input id="oEmail" placeholder="Owner email" type="email">
      <input id="oPass" type="password" placeholder="Password">
      <button class="primary" onclick="ownerLogin()">Login</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (async function() {
      const s = getSession();
      if (!s) return;
      const ok = await waitForFirebase();
      const uid = await waitForAuth();
      if (s && s.role === 'owner' && uid) { location.replace('owner.html'); return; }
      if (s && s.role === 'user' && uid)  { location.replace('user.html');  return; }
      // session hai par auth nahi → session clear karo
      if (s && !uid) {
        localStorage.removeItem('role');
        localStorage.removeItem('session');
      }
    })();

    const tabU = document.getElementById('tabUser');
    const tabO = document.getElementById('tabOwner');
    tabU.onclick = () => {
      tabU.style.background = '#2e7d32'; tabU.style.color = '#fff';
      tabO.style.background = '#ccc'; tabO.style.color = '#333';
      document.getElementById('userForm').classList.remove('hidden');
      document.getElementById('ownerForm').classList.add('hidden');
    };
    tabO.onclick = () => {
      tabO.style.background = '#2e7d32'; tabO.style.color = '#fff';
      tabU.style.background = '#ccc'; tabU.style.color = '#333';
      document.getElementById('ownerForm').classList.remove('hidden');
      document.getElementById('userForm').classList.add('hidden');
    };

    /* =========================================================
       CUSTOMER LOGIN
       Phone number ko email/password me convert karte hain
       taaki har baar SAME Firebase UID mile.
       ========================================================= */
    async function userLogin() {
      const phone = document.getElementById('uPhone').value.trim();
      if (phone.length !== 10) return toast('10 digit phone daalo');

      toast('Login ho raha hai...');
      const ok = await waitForFirebase();
      if (!ok) return toast('❌ Firebase ready nahi');

      try {
        // Phone se fake email/password banao — fixed (same phone = same UID)
        const fakeEmail = phone + '@dukan.local';
        const fakePass = 'Dukan@' + phone + 'Secure!';

        let fbUser = null;
        try {
          // Pehle login try karo
          fbUser = await AUTH.signInWithEmailAndPassword(fakeEmail, fakePass);
          fbUser = fbUser.user;
          console.log('✅ Existing customer login:', fbUser.uid);
        } catch (e) {
          // Account nahi hai → naya banao
          if (e.code === 'auth/user-not-found' ||
              e.code === 'auth/invalid-credential' ||
              e.code === 'auth/wrong-password') {
            try {
              const cred = await AUTH.createUserWithEmailAndPassword(fakeEmail, fakePass);
              fbUser = cred.user;
              console.log('✅ Naya customer account:', fbUser.uid);
            } catch (e2) {
              // agar email already in use hai (rare case)
              if (e2.code === 'auth/email-already-in-use') {
                throw new Error('Is phone se account already hai — password mismatch. Owner se contact karo.');
              }
              throw e2;
            }
          } else {
            throw e;
          }
        }

        const uid = fbUser.uid;
        await waitForAuth();

        // User document dhundo uid se
        let user = await fbLoadMyUser(uid);

        if (!user) {
          user = {
            id: uid,
            name: 'Customer',
            phone: phone,
            address: '',
            price_type: 'retail',
            special_prices: {},
            created_at: new Date().toISOString()
          };
          await fbSaveUser(user);
          toast('✅ Register ho gaya');
        } else {
          // Phone update karo agar alag hai
          if (user.phone !== phone) {
            user.phone = phone;
            await fbSaveUser(user);
          }
          toast('Wapas swagat, ' + (user.name || 'Customer') + '!');
        }

        saveSession('user', {
          id: uid,
          name: user.name || 'Customer',
          phone: user.phone,
          price_type: user.price_type || 'retail'
        });

        setTimeout(() => location.replace('user.html'), 500);
      } catch (e) {
        console.error('Customer login error:', e);
        toast('❌ ' + (e.message || 'Login fail'));
      }
    }

    /* =========================================================
       OWNER LOGIN
       Email + Password (Firebase Authentication)
       ========================================================= */
    async function ownerLogin() {
      const email = document.getElementById('oEmail').value.trim();
      const pass = document.getElementById('oPass').value.trim();
      if (!email || !pass) return toast('Email aur password daalo');

      toast('Login ho raha hai...');
      const ok = await waitForFirebase();
      if (!ok) return toast('❌ Firebase ready nahi');

      try {
        const fbUser = await ownerSignIn(email, pass);
        await waitForAuth();
        saveSession('owner', { uid: fbUser.uid, email: fbUser.email });
        toast('✅ Owner login ho gaya');
        setTimeout(() => location.replace('owner.html'), 500);
      } catch (e) {
        console.error('Owner login error:', e);
        if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password') {
          toast('❌ Email ya password galat');
        } else if (e.code === 'auth/user-not-found') {
          toast('❌ Owner account nahi hai');
        } else if (e.code === 'auth/invalid-email') {
          toast('❌ Email format galat');
        } else {
          toast('❌ ' + e.message);
        }
      }
    }
  </script>
</body>
</html>
